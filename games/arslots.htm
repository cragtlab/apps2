<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Slot Machine AR — Object Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  :root{
    --wood-dark:#2c1810; --wood:#5a3825; --wood-light:#8a5a3a;
    --brass:#c9a227; --brass-light:#f0d878; --cream:#f3e6c8;
    --red:#b3252a; --red-dark:#7a1a1e; --shadow:#150c07;
    --scan:#5ecbf0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Space Mono',monospace; touch-action:none;}

  #video{ position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #overlay{ position:fixed; inset:0; width:100%; height:100%; z-index:4; }

  #hint{
    position:fixed; left:0; right:0; top:14px; text-align:center; z-index:5; pointer-events:none;
  }
  #hint span{
    background:rgba(21,12,7,.8); color:var(--brass-light); border:1px solid var(--brass);
    padding:6px 12px; font-size:11px; letter-spacing:.05em; border-radius:20px;
  }

  #rescanBtn{
    position:fixed; right:14px; top:14px; z-index:8;
    background:rgba(21,12,7,.85); color:var(--brass-light); border:1px solid var(--brass);
    padding:8px 12px; font-size:10px; letter-spacing:.06em; border-radius:20px;
    font-family:'Space Mono',monospace; display:none;
  }

  #machine{
    position:absolute; top:0; left:0; width:220px;
    transform-origin:top left;
    background:linear-gradient(160deg,var(--wood-light),var(--wood) 55%,var(--wood-dark));
    border:4px solid var(--wood-dark); border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 0 0 2px var(--brass);
    padding:8px; display:none; z-index:6; flex-direction:column; gap:6px;
    transition:opacity .25s;
  }
  #machine.placed{ display:flex; }
  #machine.stale{ opacity:.35; }

  #marquee{
    text-align:center; font-family:'Bungee',cursive; color:var(--brass-light);
    font-size:12px; letter-spacing:.02em; text-shadow:0 0 6px rgba(240,216,120,.5);
  }
  #reelWindow{
    background:var(--shadow); border:3px solid var(--brass); border-radius:6px;
    padding:5px; display:flex; gap:4px; position:relative;
  }
  #payline{
    position:absolute; left:3px; right:3px; top:50%; height:2px; background:var(--red);
    opacity:.85; transform:translateY(-1px); box-shadow:0 0 5px var(--red);
  }
  .reel{ flex:1; background:var(--cream); border-radius:3px; overflow:hidden; height:34px; position:relative; }
  .reelStrip{ display:flex; flex-direction:column; align-items:center; }
  .sym{ font-size:18px; line-height:1.4; height:1.4em; display:flex; align-items:center; justify-content:center;}

  #status{ text-align:center; font-size:8px; letter-spacing:.05em; color:var(--brass-light); min-height:10px; }
  #credits{ display:flex; justify-content:space-between; font-size:8px; letter-spacing:.04em; padding:0 2px; }
  #credits b{ color:var(--brass-light); font-size:11px; }
  #tapBtn{
    background:var(--red); border:2px solid var(--brass); color:var(--cream);
    font-family:'Space Mono',monospace; font-weight:700; font-size:9px;
    letter-spacing:.08em; text-transform:uppercase; padding:6px; border-radius:4px;
  }
  #tapBtn:active{ background:var(--red-dark); }

  #startScreen{
    position:fixed; inset:0; z-index:20; background:var(--shadow); color:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #startScreen h1{ font-family:'Bungee',cursive; color:var(--brass-light); font-size:20px; }
  #startScreen p{ max-width:300px; font-size:12px; line-height:1.6; opacity:.85; }
  #startBtn{
    margin-top:16px; background:var(--red); color:var(--cream); border:2px solid var(--brass);
    padding:12px 24px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; border-radius:4px; font-family:'Space Mono',monospace;
  }
  #loadingNote{ font-size:10px; opacity:.6; margin-top:10px; }

  #winFlash{
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background:radial-gradient(circle,rgba(240,216,120,.3),transparent 60%);
    opacity:0;
  }
  #winFlash.show{ opacity:1; animation:flick .5s ease-in-out 2; }
  @keyframes flick{ 0%,100%{opacity:.15;} 50%{opacity:.75;} }
</style>
</head>
<body>

<div id="startScreen">
  <h1>SLOT MACHINE AR</h1>
  <p>Point your camera around. Anything the model recognizes gets outlined and labeled — <b>tap the label</b> to lock the machine onto that object and track it.</p>
  <button id="startBtn">Start Camera</button>
  <div id="loadingNote">loading object recognizer…</div>
</div>

<div id="winFlash"></div>
<div id="hint" style="display:none;"><span id="hintText">Scanning for objects…</span></div>
<button id="rescanBtn">↻ Rescan / pick new object</button>

<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>

<div id="machine">
  <div id="marquee">★ LUCKY PULL ★</div>
  <div id="reelWindow">
    <div id="payline"></div>
    <div class="reel"><div class="reelStrip" id="r0"></div></div>
    <div class="reel"><div class="reelStrip" id="r1"></div></div>
    <div class="reel"><div class="reelStrip" id="r2"></div></div>
  </div>
  <div id="status">LOCKED ON</div>
  <div id="credits"><span>CREDITS</span><b id="creditVal">10</b></div>
  <button id="tapBtn">Tap To Pull</button>
</div>

<script>
/* ---------- slot machine logic ---------- */
const SYMS = ['🍒','🍋','🔔','⭐','7️⃣','🍇','💎'];
const REEL_LEN = 18;
function buildStrip(el, finalSym){
  el.innerHTML='';
  const seq=[];
  for(let i=0;i<REEL_LEN;i++) seq.push(SYMS[Math.floor(Math.random()*SYMS.length)]);
  seq[seq.length-1]=finalSym;
  seq.forEach(s=>{ const d=document.createElement('div'); d.className='sym'; d.textContent=s; el.appendChild(d); });
}
let credits=10, spinning=false;
const creditVal=document.getElementById('creditVal');
const statusEl=document.getElementById('status');
const winFlash=document.getElementById('winFlash');
function setCredits(v){ credits=v; creditVal.textContent=credits; }

function spinReel(el, finalSym, duration){
  return new Promise(resolve=>{
    buildStrip(el, finalSym);
    const fontPx = parseFloat(getComputedStyle(el.firstChild).fontSize);
    const stepH = fontPx*1.4;
    const targetY = -(REEL_LEN-1)*stepH - stepH*1.2;
    el.style.transition='none'; el.style.transform='translateY(0px)';
    void el.offsetHeight;
    el.style.transition=`transform ${duration}ms cubic-bezier(.12,.72,.25,1)`;
    requestAnimationFrame(()=>{ el.style.transform=`translateY(${targetY}px)`; });
    setTimeout(resolve, duration);
  });
}
async function pullLever(){
  if(spinning) return;
  if(credits<=0){ statusEl.textContent='OUT OF CREDITS'; return; }
  spinning=true;
  setCredits(credits-1);
  statusEl.textContent='SPINNING...';
  const final=[0,1,2].map(()=>SYMS[Math.floor(Math.random()*SYMS.length)]);
  await Promise.all([
    spinReel(document.getElementById('r0'), final[0], 900),
    spinReel(document.getElementById('r1'), final[1], 1200),
    spinReel(document.getElementById('r2'), final[2], 1500),
  ]);
  const win = final[0]===final[1] && final[1]===final[2];
  if(win){
    const payout = final[0]==='7️⃣'?50:final[0]==='💎'?30:10;
    setCredits(credits+payout);
    statusEl.textContent = `JACKPOT +${payout}`;
    winFlash.classList.add('show');
    setTimeout(()=>winFlash.classList.remove('show'),1000);
  } else {
    statusEl.textContent='NO MATCH — TAP AGAIN';
  }
  spinning=false;
}
['r0','r1','r2'].forEach(id=>buildStrip(document.getElementById(id), SYMS[0]));
document.getElementById('tapBtn').addEventListener('click', (e)=>{ e.stopPropagation(); pullLever(); });

/* ---------- video + detection setup ---------- */
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const machine = document.getElementById('machine');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const rescanBtn = document.getElementById('rescanBtn');

let model = null;
let mode = 'idle'; // 'scanning' | 'tracking'
let detections = []; // last raw detections, in video-native pixel coords
let tracked = null; // {class, box:{x,y,w,h} normalized}, box in fractional video coords
let missCount = 0;

function resizeOverlay(){
  overlay.width = overlay.clientWidth;
  overlay.height = overlay.clientHeight;
}
window.addEventListener('resize', resizeOverlay);

// map native video pixel bbox -> displayed (object-fit:contain) screen box
function videoBoxToScreen(bx, by, bw, bh){
  const vw = video.videoWidth, vh = video.videoHeight;
  const dw = video.clientWidth, dh = video.clientHeight;
  const scale = Math.min(dw/vw, dh/vh);
  const rw = vw*scale, rh = vh*scale;
  const offX = (dw-rw)/2, offY = (dh-rh)/2;
  return { x: offX + bx*scale, y: offY + by*scale, w: bw*scale, h: bh*scale };
}

function normalizedFromPixel(bx,by,bw,bh){
  return { x: bx/video.videoWidth, y: by/video.videoHeight, w: bw/video.videoWidth, h: bh/video.videoHeight };
}

function drawScanningOverlay(){
  octx.clearRect(0,0,overlay.width,overlay.height);
  detections.forEach(d=>{
    const [bx,by,bw,bh] = d.bbox;
    const s = videoBoxToScreen(bx,by,bw,bh);
    octx.strokeStyle = 'rgba(94,203,240,0.9)';
    octx.lineWidth = 2;
    octx.strokeRect(s.x, s.y, s.w, s.h);
    const label = `${d.class} ${Math.round(d.score*100)}%`;
    octx.font = '600 12px "Space Mono", monospace';
    const tw = octx.measureText(label).width + 10;
    octx.fillStyle = 'rgba(21,12,7,0.85)';
    octx.fillRect(s.x, Math.max(0,s.y-20), tw, 20);
    octx.fillStyle = '#5ecbf0';
    octx.fillText(label, s.x+5, Math.max(14,s.y-6));
  });
}

function iou(a,b){
  const ax2=a.x+a.w, ay2=a.y+a.h, bx2=b.x+b.w, by2=b.y+b.h;
  const ix1=Math.max(a.x,b.x), iy1=Math.max(a.y,b.y);
  const ix2=Math.min(ax2,bx2), iy2=Math.min(ay2,by2);
  const iw=Math.max(0,ix2-ix1), ih=Math.max(0,iy2-iy1);
  const inter = iw*ih;
  const union = a.w*a.h + b.w*b.h - inter;
  return union<=0 ? 0 : inter/union;
}

function updateMachinePosition(normBox){
  const s = videoBoxToScreen(normBox.x*video.videoWidth, normBox.y*video.videoHeight, normBox.w*video.videoWidth, normBox.h*video.videoHeight);
  const baseW = 220;
  const scale = Math.max(0.35, Math.min(2.2, s.w/baseW));
  machine.style.transform = `translate(${s.x}px, ${s.y}px) scale(${scale})`;
}

function enterScanning(){
  mode = 'scanning';
  tracked = null;
  machine.classList.remove('placed');
  rescanBtn.style.display = 'none';
  hintText.textContent = 'Scanning for objects… tap a label to track it';
}

function enterTracking(det){
  mode = 'tracking';
  tracked = { class: det.class, box: normalizedFromPixel(...det.bbox) };
  machine.classList.add('placed');
  machine.classList.remove('stale');
  rescanBtn.style.display = 'block';
  hintText.textContent = `Tracking: ${det.class}`;
  updateMachinePosition(tracked.box);
  octx.clearRect(0,0,overlay.width,overlay.height);
}

overlay.addEventListener('click', (e)=>{
  if(mode !== 'scanning') return;
  const rect = overlay.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  for(const d of detections){
    const [bx,by,bw,bh] = d.bbox;
    const s = videoBoxToScreen(bx,by,bw,bh);
    if(cx>=s.x && cx<=s.x+s.w && cy>=s.y-20 && cy<=s.y+s.h){
      enterTracking(d);
      return;
    }
  }
});

rescanBtn.addEventListener('click', enterScanning);

async function detectLoop(){
  if(model && video.videoWidth){
    try{
      detections = await model.detect(video);
    }catch(err){ detections = []; }

    if(mode === 'scanning'){
      drawScanningOverlay();
    } else if(mode === 'tracking' && tracked){
      // find best match: same class, highest IoU with last box
      let best=null, bestScore=0;
      for(const d of detections){
        if(d.class !== tracked.class) continue;
        const nb = normalizedFromPixel(...d.bbox);
        const score = iou(nb, tracked.box);
        if(score > bestScore){ bestScore = score; best = nb; }
      }
      if(best && bestScore > 0.05){
        missCount = 0;
        tracked.box = {
          x: tracked.box.x*0.5+best.x*0.5, y: tracked.box.y*0.5+best.y*0.5,
          w: tracked.box.w*0.5+best.w*0.5, h: tracked.box.h*0.5+best.h*0.5
        };
        updateMachinePosition(tracked.box);
        machine.classList.remove('stale');
        hintText.textContent = `Tracking: ${tracked.class}`;
      } else {
        missCount++;
        if(missCount > 6){
          machine.classList.add('stale');
          hintText.textContent = `Lost "${tracked.class}" — hold still, or rescan`;
        }
        if(missCount > 30){
          enterScanning();
        }
      }
    }
  }
  requestAnimationFrame(detectLoop);
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    video.srcObject = stream;
    await new Promise(r=>video.onloadedmetadata=r);
    video.play();
    resizeOverlay();
    document.getElementById('loadingNote').textContent = 'loading object recognizer…';
    model = await cocoSsd.load({base:'lite_mobilenet_v2'});
    document.getElementById('startScreen').style.display='none';
    hint.style.display='block';
    enterScanning();
    detectLoop();
  }catch(e){
    alert('Camera or model failed to start: '+e.message);
  }
});
</script>
</body>
</html>
