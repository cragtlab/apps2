<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Slot Machine AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#2c1810; --wood:#5a3825; --wood-light:#8a5a3a;
    --brass:#c9a227; --brass-light:#f0d878; --cream:#f3e6c8;
    --red:#b3252a; --red-dark:#7a1a1e; --shadow:#150c07;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Space Mono',monospace; touch-action:none;}

  #video{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }

  #hint{
    position:fixed; left:0; right:0; top:14px; text-align:center; z-index:5; pointer-events:none;
  }
  #hint span{
    background:rgba(21,12,7,.75); color:var(--brass-light); border:1px solid var(--brass);
    padding:6px 12px; font-size:11px; letter-spacing:.06em; border-radius:20px;
  }

  #placeTap{
    position:fixed; inset:0; z-index:4;
  }

  #machine{
    position:absolute; top:0; left:0; width:220px;
    transform-origin:top left;
    background:linear-gradient(160deg,var(--wood-light),var(--wood) 55%,var(--wood-dark));
    border:4px solid var(--wood-dark); border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 0 0 2px var(--brass);
    padding:8px; display:none; z-index:6; flex-direction:column; gap:6px;
    cursor:grab;
  }
  #machine.placed{ display:flex; }
  #machine.dragging{ cursor:grabbing; box-shadow:0 4px 14px rgba(0,0,0,.7), 0 0 0 3px var(--brass-light); }

  #marquee{
    text-align:center; font-family:'Bungee',cursive; color:var(--brass-light);
    font-size:12px; letter-spacing:.02em; text-shadow:0 0 6px rgba(240,216,120,.5);
    pointer-events:none;
  }
  #reelWindow{
    background:var(--shadow); border:3px solid var(--brass); border-radius:6px;
    padding:5px; display:flex; gap:4px; position:relative; pointer-events:none;
  }
  #payline{
    position:absolute; left:3px; right:3px; top:50%; height:2px; background:var(--red);
    opacity:.85; transform:translateY(-1px); box-shadow:0 0 5px var(--red);
  }
  .reel{ flex:1; background:var(--cream); border-radius:3px; overflow:hidden; height:34px; position:relative; }
  .reelStrip{ display:flex; flex-direction:column; align-items:center; }
  .sym{ font-size:18px; line-height:1.4; height:1.4em; display:flex; align-items:center; justify-content:center;}

  #status{ text-align:center; font-size:8px; letter-spacing:.05em; color:var(--brass-light); min-height:10px; pointer-events:none; }
  #credits{ display:flex; justify-content:space-between; font-size:8px; letter-spacing:.04em; padding:0 2px; pointer-events:none; }
  #credits b{ color:var(--brass-light); font-size:11px; }
  #tapBtn{
    background:var(--red); border:2px solid var(--brass); color:var(--cream);
    font-family:'Space Mono',monospace; font-weight:700; font-size:9px;
    letter-spacing:.08em; text-transform:uppercase; padding:6px; border-radius:4px;
  }
  #tapBtn:active{ background:var(--red-dark); }

  #resizeHandle{
    position:absolute; right:-10px; bottom:-10px; width:26px; height:26px;
    background:var(--brass-light); border:2px solid var(--wood-dark); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--wood-dark);
    cursor:nwse-resize;
  }
  #removeHandle{
    position:absolute; left:-10px; top:-10px; width:22px; height:22px;
    background:var(--red); border:2px solid var(--wood-dark); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--cream);
    line-height:1;
  }

  #startScreen{
    position:fixed; inset:0; z-index:20; background:var(--shadow); color:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #startScreen h1{ font-family:'Bungee',cursive; color:var(--brass-light); font-size:20px; }
  #startScreen p{ max-width:300px; font-size:12px; line-height:1.6; opacity:.85; }
  #startBtn{
    margin-top:16px; background:var(--red); color:var(--cream); border:2px solid var(--brass);
    padding:12px 24px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; border-radius:4px; font-family:'Space Mono',monospace;
  }

  #winFlash{
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background:radial-gradient(circle,rgba(240,216,120,.3),transparent 60%);
    opacity:0;
  }
  #winFlash.show{ opacity:1; animation:flick .5s ease-in-out 2; }
  @keyframes flick{ 0%,100%{opacity:.15;} 50%{opacity:.75;} }
</style>
</head>
<body>

<div id="startScreen">
  <h1>SLOT MACHINE AR</h1>
  <p>Point your camera at anything. Tap once to <b>drop the machine</b> on it, drag it into place, and use the corner handle to resize. Tap the button to pull.</p>
  <button id="startBtn">Start Camera</button>
</div>

<div id="winFlash"></div>
<div id="hint" style="display:none;"><span id="hintText">Tap anywhere to place the machine</span></div>

<video id="video" autoplay playsinline muted></video>
<div id="placeTap"></div>

<div id="machine">
  <div id="removeHandle">✕</div>
  <div id="marquee">★ LUCKY PULL ★</div>
  <div id="reelWindow">
    <div id="payline"></div>
    <div class="reel"><div class="reelStrip" id="r0"></div></div>
    <div class="reel"><div class="reelStrip" id="r1"></div></div>
    <div class="reel"><div class="reelStrip" id="r2"></div></div>
  </div>
  <div id="status">DROPPED — DRAG TO POSITION</div>
  <div id="credits"><span>CREDITS</span><b id="creditVal">10</b></div>
  <button id="tapBtn">Tap To Pull</button>
  <div id="resizeHandle">↔</div>
</div>

<script>
const SYMS = ['🍒','🍋','🔔','⭐','7️⃣','🍇','💎'];
const REEL_LEN = 18;
function buildStrip(el, finalSym){
  el.innerHTML='';
  const seq=[];
  for(let i=0;i<REEL_LEN;i++) seq.push(SYMS[Math.floor(Math.random()*SYMS.length)]);
  seq[seq.length-1]=finalSym;
  seq.forEach(s=>{ const d=document.createElement('div'); d.className='sym'; d.textContent=s; el.appendChild(d); });
}
let credits=10, spinning=false;
const creditVal=document.getElementById('creditVal');
const statusEl=document.getElementById('status');
const winFlash=document.getElementById('winFlash');
function setCredits(v){ credits=v; creditVal.textContent=credits; }

function spinReel(el, finalSym, duration){
  return new Promise(resolve=>{
    buildStrip(el, finalSym);
    const fontPx = parseFloat(getComputedStyle(el.firstChild).fontSize);
    const stepH = fontPx*1.4;
    const targetY = -(REEL_LEN-1)*stepH - stepH*1.2;
    el.style.transition='none'; el.style.transform='translateY(0px)';
    void el.offsetHeight;
    el.style.transition=`transform ${duration}ms cubic-bezier(.12,.72,.25,1)`;
    requestAnimationFrame(()=>{ el.style.transform=`translateY(${targetY}px)`; });
    setTimeout(resolve, duration);
  });
}

async function pullLever(){
  if(spinning) return;
  if(credits<=0){ statusEl.textContent='OUT OF CREDITS'; return; }
  spinning=true;
  setCredits(credits-1);
  statusEl.textContent='SPINNING...';
  const final=[0,1,2].map(()=>SYMS[Math.floor(Math.random()*SYMS.length)]);
  await Promise.all([
    spinReel(document.getElementById('r0'), final[0], 900),
    spinReel(document.getElementById('r1'), final[1], 1200),
    spinReel(document.getElementById('r2'), final[2], 1500),
  ]);
  const win = final[0]===final[1] && final[1]===final[2];
  if(win){
    const payout = final[0]==='7️⃣'?50:final[0]==='💎'?30:10;
    setCredits(credits+payout);
    statusEl.textContent = `JACKPOT +${payout}`;
    winFlash.classList.add('show');
    setTimeout(()=>winFlash.classList.remove('show'),1000);
  } else {
    statusEl.textContent='NO MATCH — TAP AGAIN';
  }
  spinning=false;
}
['r0','r1','r2'].forEach(id=>buildStrip(document.getElementById(id), SYMS[0]));

// --- placement / drag / resize (screen-space, no tracking) ---
const video = document.getElementById('video');
const machine = document.getElementById('machine');
const placeTap = document.getElementById('placeTap');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const tapBtn = document.getElementById('tapBtn');
const resizeHandle = document.getElementById('resizeHandle');
const removeHandle = document.getElementById('removeHandle');

let state = { x:0, y:0, scale:1 };
let placed = false;

function applyTransform(){
  machine.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
}

function placeAt(clientX, clientY){
  const baseW = 220, baseH = machine.offsetHeight || 180;
  state.x = clientX - (baseW*state.scale)/2;
  state.y = clientY - (baseH*state.scale)/2;
  applyTransform();
  if(!placed){
    placed = true;
    machine.classList.add('placed');
    hintText.textContent = 'Drag to move · corner handle to resize · ✕ to remove';
  }
}

placeTap.addEventListener('click', (e)=>{
  placeAt(e.clientX, e.clientY);
});

// drag machine body (ignore handles/button)
let dragging = false, dragOffset = {x:0,y:0};
machine.addEventListener('pointerdown', (e)=>{
  if(e.target === resizeHandle || e.target === tapBtn || e.target === removeHandle) return;
  dragging = true;
  machine.classList.add('dragging');
  dragOffset.x = e.clientX - state.x;
  dragOffset.y = e.clientY - state.y;
  machine.setPointerCapture(e.pointerId);
});
machine.addEventListener('pointermove', (e)=>{
  if(!dragging) return;
  state.x = e.clientX - dragOffset.x;
  state.y = e.clientY - dragOffset.y;
  applyTransform();
});
machine.addEventListener('pointerup', ()=>{ dragging=false; machine.classList.remove('dragging'); });
machine.addEventListener('pointercancel', ()=>{ dragging=false; machine.classList.remove('dragging'); });

// resize
let resizing = false, resizeStart = {x:0, scale:1};
resizeHandle.addEventListener('pointerdown', (e)=>{
  e.stopPropagation();
  resizing = true;
  resizeStart.x = e.clientX;
  resizeStart.scale = state.scale;
  resizeHandle.setPointerCapture(e.pointerId);
});
resizeHandle.addEventListener('pointermove', (e)=>{
  if(!resizing) return;
  const delta = (e.clientX - resizeStart.x) / 220;
  state.scale = Math.max(0.4, Math.min(2.5, resizeStart.scale + delta));
  applyTransform();
});
resizeHandle.addEventListener('pointerup', ()=>{ resizing=false; });
resizeHandle.addEventListener('pointercancel', ()=>{ resizing=false; });

removeHandle.addEventListener('click', (e)=>{
  e.stopPropagation();
  placed = false;
  machine.classList.remove('placed');
  hintText.textContent = 'Tap anywhere to place the machine';
});

tapBtn.addEventListener('click', (e)=>{ e.stopPropagation(); pullLever(); });

document.getElementById('startBtn').addEventListener('click', async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    video.srcObject = stream;
    await new Promise(r=>video.onloadedmetadata=r);
    video.play();
    document.getElementById('startScreen').style.display='none';
    hint.style.display='block';
  }catch(e){
    alert('Camera access failed: '+e.message);
  }
});
</script>
</body>
</html>
