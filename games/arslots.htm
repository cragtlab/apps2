<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Square Slot AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="cvReady()"></script>
<style>
  :root{
    --wood-dark:#2c1810; --wood:#5a3825; --wood-light:#8a5a3a;
    --brass:#c9a227; --brass-light:#f0d878; --cream:#f3e6c8;
    --red:#b3252a; --red-dark:#7a1a1e; --shadow:#150c07;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Space Mono',monospace;}

  #video{
    position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000;
  }

  #hint{
    position:fixed; left:0; right:0; top:14px; text-align:center; z-index:5;
    pointer-events:none;
  }
  #hint span{
    background:rgba(21,12,7,.75); color:var(--brass-light); border:1px solid var(--brass);
    padding:6px 12px; font-size:11px; letter-spacing:.06em; border-radius:20px;
  }

  #machine{
    position:absolute; top:0; left:0; width:220px;
    transform-origin:top left;
    background:linear-gradient(160deg,var(--wood-light),var(--wood) 55%,var(--wood-dark));
    border:4px solid var(--wood-dark); border-radius:10px;
    box-shadow:0 10px 24px rgba(0,0,0,.5), inset 0 0 0 2px var(--brass);
    padding:8px; display:none; z-index:6;
    transition:transform .12s linear, opacity .2s;
  }
  #machine.locked{ display:flex; flex-direction:column; gap:6px; }
  #machine.stale{ opacity:.35; }

  #marquee{
    text-align:center; font-family:'Bungee',cursive; color:var(--brass-light);
    font-size:12px; letter-spacing:.02em; text-shadow:0 0 6px rgba(240,216,120,.5);
  }
  #reelWindow{
    background:var(--shadow); border:3px solid var(--brass); border-radius:6px;
    padding:5px; display:flex; gap:4px; position:relative;
  }
  #payline{
    position:absolute; left:3px; right:3px; top:50%; height:2px; background:var(--red);
    opacity:.85; transform:translateY(-1px); box-shadow:0 0 5px var(--red);
  }
  .reel{ flex:1; background:var(--cream); border-radius:3px; overflow:hidden; height:34px; position:relative; }
  .reelStrip{ display:flex; flex-direction:column; align-items:center; }
  .sym{ font-size:18px; line-height:1.4; height:1.4em; display:flex; align-items:center; justify-content:center;}

  #status{ text-align:center; font-size:8px; letter-spacing:.05em; color:var(--brass-light); min-height:10px; }
  #credits{ display:flex; justify-content:space-between; font-size:8px; letter-spacing:.04em; padding:0 2px; }
  #credits b{ color:var(--brass-light); font-size:11px; }
  #tapBtn{
    background:var(--red); border:2px solid var(--brass); color:var(--cream);
    font-family:'Space Mono',monospace; font-weight:700; font-size:9px;
    letter-spacing:.08em; text-transform:uppercase; padding:5px; border-radius:4px;
  }
  #tapBtn:active{ background:var(--red-dark); }

  #startScreen{
    position:fixed; inset:0; z-index:20; background:var(--shadow); color:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #startScreen h1{ font-family:'Bungee',cursive; color:var(--brass-light); font-size:20px; }
  #startScreen p{ max-width:300px; font-size:12px; line-height:1.6; opacity:.85; }
  #startBtn{
    margin-top:16px; background:var(--red); color:var(--cream); border:2px solid var(--brass);
    padding:12px 24px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; border-radius:4px; font-family:'Space Mono',monospace;
  }
  #loadingNote{ font-size:10px; opacity:.6; margin-top:10px; }

  #winFlash{
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background:radial-gradient(circle,rgba(240,216,120,.3),transparent 60%);
    opacity:0;
  }
  #winFlash.show{ opacity:1; animation:flick .5s ease-in-out 2; }
  @keyframes flick{ 0%,100%{opacity:.15;} 50%{opacity:.75;} }
</style>
</head>
<body>

<div id="startScreen">
  <h1>SQUARE SLOT AR</h1>
  <p>No 3D scene, no hand tracking — just point your back camera at <b>any square</b> (a sticky note, a card, a book cover) and a slot machine locks onto it. Tap it to pull.</p>
  <button id="startBtn">Start Camera</button>
  <div id="loadingNote">loading vision engine…</div>
</div>

<div id="winFlash"></div>
<div id="hint" style="display:none;"><span id="hintText">Looking for a square…</span></div>

<video id="video" autoplay playsinline muted></video>
<canvas id="proc" style="display:none;"></canvas>

<div id="machine">
  <div id="marquee">★ LUCKY PULL ★</div>
  <div id="reelWindow">
    <div id="payline"></div>
    <div class="reel"><div class="reelStrip" id="r0"></div></div>
    <div class="reel"><div class="reelStrip" id="r1"></div></div>
    <div class="reel"><div class="reelStrip" id="r2"></div></div>
  </div>
  <div id="status">LOCKED ON</div>
  <div id="credits"><span>CREDITS</span><b id="creditVal">10</b></div>
  <button id="tapBtn">Tap To Pull</button>
</div>

<script>
let cvLoaded = false;
function cvReady(){ cvLoaded = true; }

const SYMS = ['🍒','🍋','🔔','⭐','7️⃣','🍇','💎'];
const REEL_LEN = 18;
function buildStrip(el, finalSym){
  el.innerHTML='';
  const seq=[];
  for(let i=0;i<REEL_LEN;i++) seq.push(SYMS[Math.floor(Math.random()*SYMS.length)]);
  seq[seq.length-1]=finalSym;
  seq.forEach(s=>{ const d=document.createElement('div'); d.className='sym'; d.textContent=s; el.appendChild(d); });
}
let credits=10, spinning=false;
const creditVal=document.getElementById('creditVal');
const statusEl=document.getElementById('status');
const winFlash=document.getElementById('winFlash');
function setCredits(v){ credits=v; creditVal.textContent=credits; }

function spinReel(el, finalSym, duration){
  return new Promise(resolve=>{
    buildStrip(el, finalSym);
    const fontPx = parseFloat(getComputedStyle(el.firstChild).fontSize);
    const stepH = fontPx*1.4;
    const targetY = -(REEL_LEN-1)*stepH - stepH*1.2;
    el.style.transition='none'; el.style.transform='translateY(0px)';
    void el.offsetHeight;
    el.style.transition=`transform ${duration}ms cubic-bezier(.12,.72,.25,1)`;
    requestAnimationFrame(()=>{ el.style.transform=`translateY(${targetY}px)`; });
    setTimeout(resolve, duration);
  });
}

async function pullLever(){
  if(spinning) return;
  if(credits<=0){ statusEl.textContent='OUT OF CREDITS'; return; }
  spinning=true;
  setCredits(credits-1);
  statusEl.textContent='SPINNING...';
  const final=[0,1,2].map(()=>SYMS[Math.floor(Math.random()*SYMS.length)]);
  await Promise.all([
    spinReel(document.getElementById('r0'), final[0], 900),
    spinReel(document.getElementById('r1'), final[1], 1200),
    spinReel(document.getElementById('r2'), final[2], 1500),
  ]);
  const win = final[0]===final[1] && final[1]===final[2];
  if(win){
    const payout = final[0]==='7️⃣'?50:final[0]==='💎'?30:10;
    setCredits(credits+payout);
    statusEl.textContent = `JACKPOT +${payout}`;
    winFlash.classList.add('show');
    setTimeout(()=>winFlash.classList.remove('show'),1000);
  } else {
    statusEl.textContent='NO MATCH — TAP AGAIN';
  }
  spinning=false;
}
document.getElementById('tapBtn').addEventListener('click', (e)=>{ e.stopPropagation(); pullLever(); });
document.getElementById('machine').addEventListener('click', pullLever);
['r0','r1','r2'].forEach(id=>buildStrip(document.getElementById(id), SYMS[0]));

// --- square detection ---
const video = document.getElementById('video');
const proc = document.getElementById('proc');
const machine = document.getElementById('machine');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');

const PROC_W = 240;
let PROC_H = 180;
let smoothed = null; // {x,y,w,h} in proc-canvas fractional coords (0-1)
let missCount = 0;

function findSquare(){
  const ctx = proc.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(video, 0, 0, PROC_W, PROC_H);
  let src, gray, edges, contours, hierarchy;
  try{
    src = cv.imread(proc);
    gray = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5,5), 0);
    edges = new cv.Mat();
    cv.Canny(gray, edges, 50, 150);
    cv.dilate(edges, edges, cv.Mat.ones(3,3,cv.CV_8U));
    contours = new cv.MatVector();
    hierarchy = new cv.Mat();
    cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

    let best = null, bestArea = 0;
    for(let i=0;i<contours.size();i++){
      const cnt = contours.get(i);
      const peri = cv.arcLength(cnt, true);
      const approx = new cv.Mat();
      cv.approxPolyDP(cnt, approx, 0.03*peri, true);
      if(approx.rows === 4 && cv.isContourConvex(approx)){
        const rect = cv.boundingRect(approx);
        const area = rect.width*rect.height;
        const aspect = rect.width / rect.height;
        const minArea = PROC_W*PROC_H*0.03;
        if(area > minArea && area > bestArea && aspect > 0.6 && aspect < 1.6){
          bestArea = area;
          best = {x:rect.x/PROC_W, y:rect.y/PROC_H, w:rect.width/PROC_W, h:rect.height/PROC_H};
        }
      }
      approx.delete(); cnt.delete();
    }
    return best;
  } finally {
    src&&src.delete(); gray&&gray.delete(); edges&&edges.delete();
    contours&&contours.delete(); hierarchy&&hierarchy.delete();
  }
}

function updateMachinePosition(box){
  // map proc-canvas fractional coords -> displayed video element box (object-fit:contain)
  const vw = video.videoWidth, vh = video.videoHeight;
  const dw = video.clientWidth, dh = video.clientHeight;
  const scale = Math.min(dw/vw, dh/vh);
  const rw = vw*scale, rh = vh*scale;
  const offX = (dw-rw)/2, offY = (dh-rh)/2;

  const px = offX + box.x*rw;
  const py = offY + box.y*rh;
  const pw = box.w*rw;
  const ph = box.h*rh;

  const baseW = 220; // machine's design width
  const s = Math.max(0.35, Math.min(2.2, pw/baseW));

  machine.style.transform = `translate(${px}px, ${py}px) scale(${s})`;
}

function loop(){
  if(video.videoWidth){
    if(proc.width !== PROC_W){ proc.width = PROC_W; PROC_H = Math.round(PROC_W*video.videoHeight/video.videoWidth); proc.height = PROC_H; }
    const box = cvLoaded ? findSquare() : null;
    if(box){
      missCount = 0;
      smoothed = smoothed ? {
        x: smoothed.x*0.6+box.x*0.4, y: smoothed.y*0.6+box.y*0.4,
        w: smoothed.w*0.6+box.w*0.4, h: smoothed.h*0.6+box.h*0.4
      } : box;
      updateMachinePosition(smoothed);
      machine.classList.add('locked'); machine.classList.remove('stale');
      machine.style.display='flex';
      hintText.textContent = 'Locked on';
    } else {
      missCount++;
      if(missCount > 12){
        machine.classList.add('stale');
        hintText.textContent = 'Looking for a square…';
        if(missCount > 40){ machine.style.display='none'; smoothed=null; }
      }
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    video.srcObject = stream;
    await new Promise(r=>video.onloadedmetadata=r);
    video.play();
    document.getElementById('startScreen').style.display='none';
    hint.style.display='block';
    const waitForCv = setInterval(()=>{ if(cvLoaded){ clearInterval(waitForCv); } }, 200);
    loop();
  }catch(e){
    alert('Camera access failed: '+e.message);
  }
});
</script>
</body>
</html>
