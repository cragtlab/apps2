<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Countryside Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#bfe3ee;
    --sky-bottom:#fbf1d8;
    --wood:#8a5a3b;
    --wood-dark:#6b4128;
    --cream:#fbf4e2;
    --ink:#3f3226;
    --leaf:#4c7a3d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 65%, #e7d9a8 100%);
    overflow-x:hidden;
  }
  .sun{
    position:fixed;
    top:-60px; right:-60px;
    width:220px; height:220px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff6d8, #ffdf7e 55%, #ffdf7e00 75%);
    pointer-events:none;
  }
  .cloud{
    position:fixed;
    opacity:0.85;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,0.05));
    animation: drift linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    from{ transform:translateX(-160px); }
    to{ transform:translateX(calc(100vw + 160px)); }
  }
  header{
    text-align:center;
    padding:28px 16px 6px;
    position:relative;
    z-index:2;
  }
  .sign{
    display:inline-block;
    background:linear-gradient(180deg,#a9764e,#8a5a3b);
    border:4px solid var(--wood-dark);
    border-radius:10px;
    padding:14px 28px;
    box-shadow:0 6px 0 var(--wood-dark), 0 10px 14px rgba(0,0,0,0.18);
    transform:rotate(-0.6deg);
  }
  .sign h1{
    margin:0;
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(22px,4vw,32px);
    color:#fff6e0;
    text-shadow:0 2px 0 rgba(0,0,0,0.25);
    letter-spacing:0.5px;
  }
  .subtitle{
    margin:14px auto 0;
    max-width:420px;
    font-size:14.5px;
    line-height:1.5;
    color:#5b4a37;
  }
  main{
    display:flex;
    justify-content:center;
    padding:18px 12px 40px;
    position:relative;
    z-index:2;
  }
  .field-wrap{
    position:relative;
  }
  canvas{
    display:block;
    touch-action:manipulation;
    cursor:pointer;
  }
  .controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  button.tool{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:9px 18px;
    border-radius:999px;
    border:2px solid var(--wood-dark);
    background:var(--cream);
    color:var(--wood-dark);
    cursor:pointer;
    box-shadow:0 3px 0 var(--wood-dark);
    transition:transform .08s ease;
  }
  button.tool:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--wood-dark);
  }
  footer{
    text-align:center;
    font-size:12.5px;
    color:#6b5a45;
    padding-bottom:26px;
    position:relative;
    z-index:2;
  }
</style>
</head>
<body>

<div class="sun"></div>
<svg class="cloud" style="top:12%; width:120px; animation-duration:52s;" viewBox="0 0 120 50"><ellipse cx="30" cy="30" rx="28" ry="18" fill="#fff"/><ellipse cx="60" cy="20" rx="30" ry="20" fill="#fff"/><ellipse cx="90" cy="30" rx="24" ry="16" fill="#fff"/></svg>
<svg class="cloud" style="top:26%; width:90px; animation-duration:70s; animation-delay:-20s;" viewBox="0 0 120 50"><ellipse cx="30" cy="30" rx="28" ry="18" fill="#fff"/><ellipse cx="60" cy="20" rx="30" ry="20" fill="#fff"/><ellipse cx="90" cy="30" rx="24" ry="16" fill="#fff"/></svg>

<header>
  <div class="sign"><h1>🌾 Little Countryside Farm</h1></div>
  <p class="subtitle">Tap any patch of land to plant a crop, raise a building, or clear it back to grass. The farmer and animals will wander the fields and go about their day on their own.</p>
</header>

<main>
  <div class="field-wrap">
    <canvas id="farm" width="720" height="520"></canvas>
  </div>
</main>

<div class="controls">
  <button class="tool" id="resetBtn">🔄 Clear the whole farm</button>
  <button class="tool" id="growBtn">🌱 Plant a few crops</button>
</div>

<footer>Click a tile again to reshuffle what's growing there.</footer>

<script>
(function(){
  const canvas = document.getElementById('farm');
  const ctx = canvas.getContext('2d');
  const GRID = 10;
  const TILE_W = 58;
  const TILE_H = 29;
  const originX = canvas.width / 2;
  const originY = 66;

  // ---- object palette ----
  // type: null means bare grass
  const OBJECTS = [
    null, null, null,               // grass is the most common outcome
    {e:'🌾', lift:10, size:30, name:'wheat'},
    {e:'🌽', lift:12, size:30, name:'corn'},
    {e:'🥕', lift:6,  size:26, name:'carrots'},
    {e:'🎃', lift:8,  size:30, name:'pumpkin patch'},
    {e:'🍓', lift:5,  size:24, name:'strawberries'},
    {e:'🌻', lift:14, size:30, name:'sunflower'},
    {e:'🌳', lift:22, size:42, name:'tree'},
    {e:'🪵', lift:6,  size:26, name:'log pile'},
    {e:'🏚️', lift:20, size:40, name:'barn'},
    {e:'⛲', lift:12, size:32, name:'well'},
    {e:'🧺', lift:4,  size:22, name:'basket'},
    {e:'🚜', lift:10, size:32, name:'tractor'},
  ];

  function randomObject(excludeIndex){
    let idx;
    do { idx = Math.floor(Math.random()*OBJECTS.length); }
    while (OBJECTS.length > 1 && idx === excludeIndex && Math.random() < 0.7);
    return idx;
  }

  // grid state: store index into OBJECTS, plus a little pop-in animation timer
  let grid = [];
  function freshGrid(sparse){
    const g = [];
    for(let y=0;y<GRID;y++){
      const row=[];
      for(let x=0;x<GRID;x++){
        row.push({idx: sparse ? (Math.random()<0.12 ? randomObject(-1) : 0) : 0, pop:0});
      }
      g.push(row);
    }
    return g;
  }
  grid = freshGrid(true);

  // ---- iso helpers ----
  function toScreen(gx, gy){
    return {
      x: originX + (gx - gy) * (TILE_W/2),
      y: originY + (gx + gy) * (TILE_H/2)
    };
  }
  function toGrid(px, py){
    const relX = px - originX;
    const relY = py - originY;
    const gx = (relX/(TILE_W/2) + relY/(TILE_H/2)) / 2;
    const gy = (relY/(TILE_H/2) - relX/(TILE_W/2)) / 2;
    return { x: Math.round(gx), y: Math.round(gy) };
  }

  function diamondPath(cx, cy){
    ctx.beginPath();
    ctx.moveTo(cx, cy - TILE_H/2);
    ctx.lineTo(cx + TILE_W/2, cy);
    ctx.lineTo(cx, cy + TILE_H/2);
    ctx.lineTo(cx - TILE_W/2, cy);
    ctx.closePath();
  }

  let hover = {x:-1,y:-1};

  // ---- characters wandering the whole farm ----
  const CAST = [
    {e:'🧑‍🌾', speed:1.5, size:30},
    {e:'🐄', speed:1.0, size:28},
    {e:'🐑', speed:1.3, size:24},
    {e:'🐔', speed:1.9, size:18},
    {e:'🐖', speed:1.1, size:24},
  ];
  const characters = CAST.map((c,i)=>{
    const gx = Math.random()*(GRID-1), gy = Math.random()*(GRID-1);
    return {
      ...c,
      x:gx, y:gy, tx:gx, ty:gy,
      state:'idle', idleUntil: performance.now()+Math.random()*1500,
      bobSeed: Math.random()*10,
      facing:1
    };
  });

  function availableTargets(excludeChar){
    const taken = new Set();
    for(const c of characters){
      if(c !== excludeChar && c.state === 'walk'){
        taken.add(Math.round(c.tx) + ',' + Math.round(c.ty));
      }
    }
    const targets = [];
    for(let y=0;y<GRID;y++){
      for(let x=0;x<GRID;x++){
        if(grid[y][x].idx !== 0 && !taken.has(x+','+y)) targets.push({x,y});
      }
    }
    return targets;
  }

  function pickTarget(c, now){
    const targets = availableTargets(c);
    if(targets.length === 0){
      // nothing to tend right now — wait and check again shortly
      c.idleUntil = now + 500 + Math.random()*700;
      return;
    }
    const t = targets[Math.floor(Math.random()*targets.length)];
    c.tx = t.x;
    c.ty = t.y;
    c.facing = (c.tx >= c.x) ? 1 : -1;
    c.state = 'walk';
  }

  function updateCharacters(now, dt){
    for(const c of characters){
      if(c.state==='idle'){
        if(now > c.idleUntil) pickTarget(c, now);
      } else {
        const dx = c.tx - c.x, dy = c.ty - c.y;
        const dist = Math.hypot(dx,dy);
        const step = c.speed * dt;
        if(dist <= step || dist < 0.03){
          c.x = c.tx; c.y = c.ty;
          c.state = 'idle';
          c.idleUntil = now + 900 + Math.random()*2200;
          const gx = Math.min(GRID-1, Math.max(0, Math.round(c.x)));
          const gy = Math.min(GRID-1, Math.max(0, Math.round(c.y)));
          const cell = grid[gy][gx];
          if(cell.idx !== 0){
            cell.idx = 0;
            cell.pop = now;
          }
        } else {
          c.x += (dx/dist) * step;
          c.y += (dy/dist) * step;
        }
      }
    }
  }

  // ---- input ----
  function handleTap(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (clientX - rect.left) * scaleX;
    const py = (clientY - rect.top) * scaleY;
    const {x,y} = toGrid(px,py);
    if(x>=0 && x<GRID && y>=0 && y<GRID){
      const cell = grid[y][x];
      cell.idx = randomObject(cell.idx);
      cell.pop = performance.now();
    }
  }
  canvas.addEventListener('click', (ev)=> handleTap(ev.clientX, ev.clientY));
  canvas.addEventListener('mousemove', (ev)=>{
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (ev.clientX - rect.left) * scaleX;
    const py = (ev.clientY - rect.top) * scaleY;
    const {x,y} = toGrid(px,py);
    hover = {x,y};
  });
  canvas.addEventListener('mouseleave', ()=>{ hover = {x:-1,y:-1}; });

  document.getElementById('resetBtn').addEventListener('click', ()=>{ grid = freshGrid(false); });
  document.getElementById('growBtn').addEventListener('click', ()=>{
    for(let i=0;i<14;i++){
      const x = Math.floor(Math.random()*GRID);
      const y = Math.floor(Math.random()*GRID);
      grid[y][x].idx = randomObject(0);
      grid[y][x].pop = performance.now();
    }
  });

  // ---- drawing ----
  function drawBaseTile(gx, gy){
    const {x:sx, y:sy} = toScreen(gx,gy);
    const checker = (gx+gy) % 2 === 0;
    const isHover = (gx===hover.x && gy===hover.y);
    diamondPath(sx, sy);
    const g = ctx.createLinearGradient(sx, sy-TILE_H/2, sx, sy+TILE_H/2);
    if(checker){
      g.addColorStop(0, isHover ? '#a9dd8e' : '#8fc97c');
      g.addColorStop(1, isHover ? '#8fcf6c' : '#74b25f');
    } else {
      g.addColorStop(0, isHover ? '#9fd781' : '#83c06f');
      g.addColorStop(1, isHover ? '#82c261' : '#699e54');
    }
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,90,40,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawSprite(gx, gy, obj, pop, now){
    if(!obj) return;
    const {x:sx, y:sy} = toScreen(gx,gy);
    let scale = 1;
    if(pop){
      const t = (now - pop) / 260;
      if(t < 1) scale = 0.4 + 0.6*Math.min(1, t) + Math.sin(t*Math.PI)*0.18;
    }
    // soft shadow
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath();
    ctx.ellipse(sx, sy+4, TILE_W*0.24, TILE_H*0.28, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(sx, sy - obj.lift);
    ctx.scale(scale, scale);
    ctx.font = `${obj.size}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(obj.e, 0, 0);
    ctx.restore();
  }

  function drawCharacter(c, now){
    const {x:sx, y:sy} = toScreen(c.x, c.y);
    const walking = c.state === 'walk';
    const bob = walking
      ? Math.abs(Math.sin(now/140 + c.bobSeed)) * 5
      : Math.sin(now/500 + c.bobSeed) * 1.6;

    ctx.save();
    ctx.globalAlpha = 0.24;
    ctx.fillStyle = '#1c2b12';
    ctx.beginPath();
    ctx.ellipse(sx, sy+3, TILE_W*0.2, TILE_H*0.22, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(sx, sy - 14 - bob);
    ctx.scale(c.facing, 1);
    ctx.font = `${c.size}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.e, 0, 0);
    ctx.restore();
  }

  function render(now){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // base tiles (flat, no occlusion issues)
    for(let y=0;y<GRID;y++)
      for(let x=0;x<GRID;x++)
        drawBaseTile(x,y);

    // build depth-sorted sprite list: tile objects + characters
    const sprites = [];
    for(let y=0;y<GRID;y++){
      for(let x=0;x<GRID;x++){
        const cell = grid[y][x];
        const obj = OBJECTS[cell.idx];
        if(obj) sprites.push({depth:x+y+0.05, draw:()=>drawSprite(x,y,obj,cell.pop,now)});
      }
    }
    for(const c of characters){
      sprites.push({depth:c.x+c.y, draw:()=>drawCharacter(c,now)});
    }
    sprites.sort((a,b)=>a.depth-b.depth);
    for(const s of sprites) s.draw();
  }

  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - lastTime)/1000);
    lastTime = now;
    updateCharacters(now, dt);
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
