<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pizza Order Rush</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #ffb703, #fb8500 55%, #e85d04);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    touch-action: none;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 10px;
  }

  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }

  header h1 {
    font-size: 1.3em;
    margin: 4px 0;
  }

  #score {
    font-size: 1.1em;
    font-weight: bold;
    background: rgba(255,255,255,0.25);
    padding: 6px 14px;
    border-radius: 20px;
  }

  #orderPanel {
    width: 100%;
    max-width: 480px;
    background: #fff8ee;
    border-radius: 16px;
    padding: 10px 14px;
    margin-top: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  #orderTitle {
    font-size: 0.85em;
    color: #7a4a1e;
    font-weight: bold;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  #orderItems {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .orderItem {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 0.95em;
    padding: 4px 8px;
    border-radius: 10px;
    background: #f1e0c4;
    transition: background 0.3s ease, transform 0.3s ease;
    min-width: 46px;
  }

  .orderItem .emoji { font-size: 1.5em; }
  .orderItem .count {
    font-weight: bold;
    color: #8a5a2b;
  }
  .orderItem.met {
    background: #c8e6a0;
    transform: scale(1.05);
  }
  .orderItem.met .count { color: #386641; }

  #pizzaWrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  #feedback {
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%) scale(0.6);
    font-size: 1.6em;
    font-weight: bold;
    color: #386641;
    text-shadow: 1px 1px 0 #fff;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    z-index: 30;
  }

  #feedback.pop {
    animation: feedbackPop 1s ease forwards;
  }
  #feedback.bad { color: #d62828; }

  @keyframes feedbackPop {
    0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
    20% { opacity: 1; transform: translateX(-50%) scale(1.2); }
    35% { transform: translateX(-50%) scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(1); }
  }

  #pizza {
    position: relative;
    width: min(72vw, 300px);
    height: min(72vw, 300px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, #ffe8a3 0%, #ffe8a3 62%, #e9b44c 64%, #c9812f 78%, #a5651f 100%);
    box-shadow: 0 10px 25px rgba(0,0,0,0.35), inset 0 0 0 6px rgba(255,255,255,0.15);
    transition: transform 0.4s ease, filter 0.4s ease;
  }

  #pizza.dragover {
    transform: scale(1.04);
    filter: brightness(1.05);
  }

  #pizza.shake {
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-2deg); }
    40% { transform: translateX(8px) rotate(2deg); }
    60% { transform: translateX(-6px) rotate(-1deg); }
    80% { transform: translateX(6px) rotate(1deg); }
  }

  #pizza.cleared {
    animation: clearedPop 0.5s ease;
  }
  @keyframes clearedPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.15) rotate(6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .sauce-dot {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffcf6b, #e08e2b 70%);
    opacity: 0.5;
  }

  .topping {
    position: absolute;
    font-size: 1.6em;
    transform: translate(-50%, -50%) scale(0);
    animation: dropIn 0.3s ease forwards;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }

  @keyframes dropIn {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-30deg); }
    70% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
  }

  #tray {
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    background: #fff8ee;
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
  }

  .ingredient {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 12px;
    padding: 8px 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    cursor: grab;
    touch-action: none;
  }

  .ingredient .emoji {
    font-size: 1.9em;
    pointer-events: none;
  }

  .ingredient .label {
    font-size: 0.65em;
    color: #7a4a1e;
    font-weight: bold;
    margin-top: 2px;
    pointer-events: none;
  }

  .ghost {
    position: fixed;
    font-size: 2.2em;
    pointer-events: none;
    z-index: 100;
    transform: translate(-50%, -50%);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
  }

  #instructions {
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    font-size: 0.8em;
    text-align: center;
    margin-top: 4px;
    opacity: 0.9;
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>🍕 Pizza Order Rush</h1>
    <div id="score">Score: 0</div>
  </header>

  <div id="orderPanel">
    <div id="orderTitle">ORDER #<span id="orderNum">1</span></div>
    <div id="orderItems"></div>
  </div>

  <div id="pizzaWrap">
    <div id="feedback"></div>
    <div id="pizza"></div>
  </div>

  <div id="instructions">Drag the toppings onto the pizza to match the order exactly</div>

  <div id="tray"></div>
</div>

<script>
  const ALL_INGREDIENTS = [
    { type: 'pepperoni', emoji: '🔴', label: 'Pepperoni' },
    { type: 'mushroom',  emoji: '🍄', label: 'Mushroom' },
    { type: 'olive',     emoji: '🫒', label: 'Olive' },
    { type: 'cheese',    emoji: '🧀', label: 'Cheese' },
    { type: 'pepper',    emoji: '🫑', label: 'Pepper' },
    { type: 'onion',     emoji: '🧅', label: 'Onion' },
    { type: 'pineapple', emoji: '🍍', label: 'Pineapple' },
    { type: 'basil',     emoji: '🌿', label: 'Basil' }
  ];

  const scoreEl = document.getElementById('score');
  const orderItemsEl = document.getElementById('orderItems');
  const orderNumEl = document.getElementById('orderNum');
  const pizzaEl = document.getElementById('pizza');
  const feedbackEl = document.getElementById('feedback');
  const trayEl = document.getElementById('tray');

  let score = 0;
  let orderNumber = 1;
  let currentOrder = {};
  let currentCounts = {};

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function buildTray() {
    trayEl.innerHTML = '';
    ALL_INGREDIENTS.forEach(ing => {
      const div = document.createElement('div');
      div.className = 'ingredient';
      div.dataset.type = ing.type;
      div.innerHTML = `<div class="emoji">${ing.emoji}</div><div class="label">${ing.label}</div>`;
      trayEl.appendChild(div);
      attachDragHandlers(div, ing);
    });
  }

  function generateOrder() {
    const shuffled = [...ALL_INGREDIENTS].sort(() => Math.random() - 0.5);
    const numTypes = randInt(2, 3);
    const order = {};
    shuffled.slice(0, numTypes).forEach(ing => {
      order[ing.type] = randInt(1, 4);
    });
    return order;
  }

  function startNewOrder() {
    currentOrder = generateOrder();
    currentCounts = {};
    Object.keys(currentOrder).forEach(t => currentCounts[t] = 0);
    orderNumEl.textContent = orderNumber;
    renderOrderPanel();
    clearPizzaVisuals();
  }

  function renderOrderPanel() {
    orderItemsEl.innerHTML = '';
    Object.keys(currentOrder).forEach(type => {
      const ing = ALL_INGREDIENTS.find(i => i.type === type);
      const need = currentOrder[type];
      const have = currentCounts[type] || 0;
      const div = document.createElement('div');
      div.className = 'orderItem' + (have >= need ? ' met' : '');
      div.innerHTML = `<div class="emoji">${ing.emoji}</div><div class="count">${have}/${need}</div>`;
      orderItemsEl.appendChild(div);
    });
  }

  function clearPizzaVisuals() {
    pizzaEl.querySelectorAll('.topping, .sauce-dot').forEach(el => el.remove());
  }

  function showFeedback(text, bad) {
    feedbackEl.textContent = text;
    feedbackEl.className = 'pop' + (bad ? ' bad' : '');
    // restart animation
    void feedbackEl.offsetWidth;
    feedbackEl.classList.add('pop');
    setTimeout(() => feedbackEl.classList.remove('pop'), 950);
  }

  function addTopping(type) {
    const ing = ALL_INGREDIENTS.find(i => i.type === type);
    const need = currentOrder[type];

    if (!need || currentCounts[type] >= need) {
      pizzaEl.classList.remove('shake');
      void pizzaEl.offsetWidth;
      pizzaEl.classList.add('shake');
      showFeedback(need ? 'Enough of that!' : 'Not on the order!', true);
      return;
    }

    currentCounts[type] = (currentCounts[type] || 0) + 1;

    // place topping at random spot within pizza circle
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 36; // percent of half-width, stays off crust edge
    const x = 50 + Math.cos(angle) * radius;
    const y = 50 + Math.sin(angle) * radius;

    const el = document.createElement('div');
    el.className = 'topping';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.textContent = ing.emoji;
    pizzaEl.appendChild(el);

    renderOrderPanel();
    checkOrderComplete();
  }

  function checkOrderComplete() {
    const complete = Object.keys(currentOrder).every(
      type => currentCounts[type] === currentOrder[type]
    );
    if (!complete) return;

    score += 10 * Object.keys(currentOrder).length;
    scoreEl.textContent = 'Score: ' + score;
    showFeedback('Order Complete! 🎉', false);

    pizzaEl.classList.remove('cleared');
    void pizzaEl.offsetWidth;
    pizzaEl.classList.add('cleared');

    setTimeout(() => {
      orderNumber += 1;
      startNewOrder();
    }, 700);
  }

  // ---- Custom pointer-based drag (works for mouse + touch) ----
  function attachDragHandlers(el, ing) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.textContent = ing.emoji;
      document.body.appendChild(ghost);
      moveGhost(ghost, e.clientX, e.clientY);

      const onMove = (ev) => {
        moveGhost(ghost, ev.clientX, ev.clientY);
        const rect = pizzaEl.getBoundingClientRect();
        const over = isOverPizza(ev.clientX, ev.clientY, rect);
        pizzaEl.classList.toggle('dragover', over);
      };

      const onUp = (ev) => {
        const rect = pizzaEl.getBoundingClientRect();
        const over = isOverPizza(ev.clientX, ev.clientY, rect);
        pizzaEl.classList.remove('dragover');
        ghost.remove();
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        if (over) addTopping(ing.type);
      };

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp, { once: true });
    });
  }

  function moveGhost(ghost, x, y) {
    ghost.style.left = x + 'px';
    ghost.style.top = y + 'px';
  }

  function isOverPizza(x, y, rect) {
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = x - cx;
    const dy = y - cy;
    const r = rect.width / 2;
    return (dx * dx + dy * dy) <= r * r;
  }

  buildTray();
  startNewOrder();
</script>

</body>
</html>
