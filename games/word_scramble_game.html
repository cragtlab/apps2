<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter Jumble!</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF8EC;
    --purple: #3D2B56;
    --coral: #FF6B5B;
    --teal: #2BB3A3;
    --yellow: #FFC93C;
    --pink: #FF9AD5;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 8% 15%, rgba(255,201,60,0.35) 0, transparent 22%),
      radial-gradient(circle at 92% 20%, rgba(43,179,163,0.3) 0, transparent 24%),
      radial-gradient(circle at 15% 90%, rgba(255,154,213,0.3) 0, transparent 22%),
      radial-gradient(circle at 90% 85%, rgba(255,107,91,0.25) 0, transparent 22%);
    font-family: 'Nunito', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--purple);
  }
  .stage {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 2.6rem;
    margin: 0 0 4px;
    color: var(--purple);
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-weight: 600;
    color: #7a6a94;
    margin: 0 0 22px;
    font-size: 1.05rem;
  }
  .card {
    background: var(--card);
    border-radius: 28px;
    padding: 32px 14px 28px;
    box-shadow: 0 14px 0 rgba(61,43,86,0.08), 0 20px 40px rgba(61,43,86,0.12);
  }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    color: var(--purple);
  }
  .length-badge {
    font-size: 0.95rem;
    color: #7a6a94;
    font-weight: 700;
  }
  .score-pill, .streak-pill {
    background: var(--yellow);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 1rem;
  }
  .streak-pill { background: var(--pink); }

  .answer-slots {
    display: flex;
    justify-content: center;
    gap: clamp(3px, 1.2vw, 8px);
    flex-wrap: nowrap;
    min-height: 46px;
    margin: 10px 0 22px;
  }
  .slot {
    width: clamp(26px, 8.5vw, 48px);
    height: clamp(34px, 10vw, 56px);
    border-bottom: 4px solid #E4DBEF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-size: clamp(0.95rem, 3.6vw, 1.8rem);
    font-weight: 700;
    color: var(--purple);
    cursor: pointer;
    transition: transform 0.12s ease;
    flex-shrink: 0;
  }
  .slot.filled { border-bottom-color: var(--teal); }
  .slot:active { transform: scale(0.92); }

  .letter-bank {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 26px;
    min-height: 64px;
  }
  .tile {
    width: 54px;
    height: 58px;
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 14px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 0 #241a37;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .tile:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #241a37;
  }
  .tile.used { visibility: hidden; }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button.action {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform 0.08s ease;
  }
  button.action:active { transform: translateY(3px); box-shadow: none; }
  .btn-hint { background: var(--yellow); color: var(--purple); }
  .btn-clear { background: #E4DBEF; color: var(--purple); }
  .btn-check { background: var(--teal); color: white; }
  .btn-next { background: var(--coral); color: white; display: none; }

  .message {
    margin-top: 16px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    min-height: 30px;
    color: var(--teal);
  }
  .message.wrong { color: var(--coral); }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 1.6rem;
    animation: fall linear forwards;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .confetti { animation: none; display: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <h1>Letter Jumble!</h1>
  <p class="subtitle">Tap the letters to unscramble the word</p>

  <div class="card">
    <div class="score-row">
      <span class="score-pill" id="score">⭐ 0</span>
      <span class="length-badge" id="lengthBadge">7 letters</span>
      <span class="streak-pill" id="streak">🔥 0</span>
    </div>

    <div class="answer-slots" id="answerSlots"></div>
    <div class="letter-bank" id="letterBank"></div>

    <div class="controls">
      <button class="action btn-hint" id="hintBtn">💡 Hint</button>
      <button class="action btn-clear" id="clearBtn">↺ Clear</button>
      <button class="action btn-check" id="checkBtn">✓ Check</button>
      <button class="action btn-next" id="nextBtn">Next word →</button>
    </div>

    <div class="message" id="message"></div>
  </div>
</div>

<script>
  const WORDS = [
    { word: "DRAGON", clue: "A giant, fire-breathing creature from stories." },
    { word: "PLANET", clue: "Earth is one, and so is Mars." },
    { word: "PIRATE", clue: "Someone who sails the seas hunting for treasure." },
    { word: "WIZARD", clue: "A person who casts magic spells." },
    { word: "VOLCANO", clue: "A mountain that can erupt with hot lava." },
    { word: "OCTOPUS", clue: "A sea animal with eight arms." },
    { word: "RAINBOW", clue: "Colorful arc you see in the sky after rain." },
    { word: "TREASURE", clue: "Gold and jewels hidden away, often on a map." },
    { word: "MYSTERY", clue: "A puzzling problem waiting to be solved." },
    { word: "JOURNEY", clue: "A long trip from one place to another." },
    { word: "WHISPER", clue: "To speak very, very quietly." },
    { word: "SPARKLE", clue: "To shine with little flashes of light." },
    { word: "CRYSTAL", clue: "A clear, sparkly kind of rock or gem." },
    { word: "THUNDER", clue: "The loud rumbling sound during a storm." },
    { word: "PYRAMID", clue: "A giant stone structure built in ancient Egypt." },
    { word: "GALAXY", clue: "A huge group of stars, like the Milky Way." },
    { word: "CAPTAIN", clue: "The person in charge of a ship or team." },
    { word: "PUZZLE", clue: "A game where you fit pieces together." },
    { word: "PENGUIN", clue: "A black-and-white bird that can't fly but can swim." },
    { word: "COMPASS", clue: "A tool that shows you which way is north." }
  ];

  let score = 0;
  let streak = 0;
  let current = null;
  let placed = [];      // indices into bank, in slot order (or null)
  let bankUsed = [];    // booleans, matches bank letters array
  let bankLetters = []; // shuffled letters for current word
  let recentWords = [];

  const elSlots = document.getElementById('answerSlots');
  const elBank = document.getElementById('letterBank');
  const elScore = document.getElementById('score');
  const elStreak = document.getElementById('streak');
  const elLengthBadge = document.getElementById('lengthBadge');
  const elMessage = document.getElementById('message');
  const elNext = document.getElementById('nextBtn');
  const elCheck = document.getElementById('checkBtn');

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickWord() {
    let choice;
    do {
      choice = WORDS[Math.floor(Math.random() * WORDS.length)];
    } while (recentWords.includes(choice.word) && recentWords.length < WORDS.length);
    recentWords.push(choice.word);
    if (recentWords.length > 5) recentWords.shift();
    return choice;
  }

  function startWord() {
    current = pickWord();
    hintStage = 0;
    elLengthBadge.textContent = current.word.length + ' letters';
    elMessage.textContent = '';
    elMessage.className = 'message';
    elNext.style.display = 'none';
    elCheck.disabled = false;

    let letters = current.word.split('');
    let shuffled;
    do {
      shuffled = shuffle(letters);
    } while (shuffled.join('') === current.word && letters.length > 1);

    bankLetters = shuffled;
    bankUsed = bankLetters.map(() => false);
    placed = new Array(current.word.length).fill(null);

    renderBank();
    renderSlots();
  }

  function renderSlots() {
    elSlots.innerHTML = '';
    placed.forEach((bankIdx, slotIdx) => {
      const slot = document.createElement('div');
      slot.className = 'slot' + (bankIdx !== null ? ' filled' : '');
      slot.textContent = bankIdx !== null ? bankLetters[bankIdx] : '';
      slot.addEventListener('click', () => {
        if (bankIdx !== null) {
          bankUsed[bankIdx] = false;
          placed[slotIdx] = null;
          renderBank();
          renderSlots();
        }
      });
      elSlots.appendChild(slot);
    });
  }

  function renderBank() {
    elBank.innerHTML = '';
    bankLetters.forEach((letter, idx) => {
      const tile = document.createElement('button');
      tile.className = 'tile' + (bankUsed[idx] ? ' used' : '');
      tile.textContent = letter;
      tile.addEventListener('click', () => {
        if (bankUsed[idx]) return;
        const emptySlot = placed.indexOf(null);
        if (emptySlot === -1) return;
        placed[emptySlot] = idx;
        bankUsed[idx] = true;
        renderBank();
        renderSlots();
      });
      elBank.appendChild(tile);
    });
  }

  function currentGuess() {
    return placed.map(idx => idx === null ? '' : bankLetters[idx]).join('');
  }

  function launchConfetti() {
    const pieces = ['🎉','⭐','🎊','✨'];
    for (let i = 0; i < 16; i++) {
      const span = document.createElement('span');
      span.className = 'confetti';
      span.textContent = pieces[Math.floor(Math.random() * pieces.length)];
      span.style.left = Math.random() * 100 + 'vw';
      span.style.animationDuration = (1.6 + Math.random() * 1.2) + 's';
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 3000);
    }
  }

  document.getElementById('checkBtn').addEventListener('click', () => {
    if (placed.includes(null)) {
      elMessage.textContent = 'Fill in all the letters first!';
      elMessage.className = 'message wrong';
      return;
    }
    if (currentGuess() === current.word) {
      score += 10;
      streak += 1;
      elScore.textContent = '⭐ ' + score;
      elStreak.textContent = '🔥 ' + streak;
      elMessage.textContent = 'Yes! ' + current.word + ' is right! 🎉';
      elMessage.className = 'message';
      elNext.style.display = 'inline-block';
      elCheck.disabled = true;
      launchConfetti();
    } else {
      streak = 0;
      elStreak.textContent = '🔥 0';
      elMessage.textContent = 'Not quite — try again!';
      elMessage.className = 'message wrong';
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    placed = placed.map(() => null);
    bankUsed = bankUsed.map(() => false);
    renderBank();
    renderSlots();
    elMessage.textContent = '';
  });

  let hintStage = 0;
  document.getElementById('hintBtn').addEventListener('click', () => {
    if (hintStage === 0) {
      elMessage.textContent = current.clue;
      elMessage.className = 'message';
      hintStage = 1;
    } else {
      if (placed[0] === null) {
        const firstLetterBankIdx = bankLetters.findIndex((l, i) => l === current.word[0] && !bankUsed[i]);
        if (firstLetterBankIdx !== -1) {
          placed[0] = firstLetterBankIdx;
          bankUsed[firstLetterBankIdx] = true;
          renderBank();
          renderSlots();
        }
      }
      elMessage.textContent = 'It starts with "' + current.word[0] + '"!';
      elMessage.className = 'message';
    }
  });

  elNext.addEventListener('click', startWord);

  startWord();
</script>

</body>
</html>
