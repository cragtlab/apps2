<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>拼句子游戏 Sentence Builder</title>
<style>
  :root{
    --bg1:#ffe9c7;
    --bg2:#c7f0ff;
    --accent:#ff8a5b;
    --accent-dark:#e06a3a;
    --good:#3fb96f;
    --bad:#e5534b;
    --slot-empty:#ffffff;
    --card:#2b6ea5;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
  }
  #app{
    max-width:520px;
    margin:0 auto;
    padding:14px 12px 30px;
    display:flex; flex-direction:column;
    min-height:100vh;
  }
  header{ text-align:center; margin-bottom:6px; }
  header h1{ margin:0; font-size:1.2rem; color:#37425a; }
  #progress{ font-size:.8rem; color:#5a6480; margin-top:2px; }

  #card{
    background:rgba(255,255,255,.55);
    border-radius:18px;
    padding:14px 12px 18px;
    margin-top:10px;
    box-shadow:0 6px 16px rgba(0,0,0,.08);
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
  }

  #instructions{
    text-align:center;
    font-size:.85rem;
    color:#4a5570;
    margin-bottom:10px;
  }

  #slots{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    min-height:64px;
    padding:10px;
    border-radius:14px;
    background:rgba(255,255,255,.5);
    margin-bottom:16px;
  }
  .slot{
    min-width:52px;
    height:52px;
    border:2px dashed #b9c2d6;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--slot-empty);
  }
  .slot.filled{ border-style:solid; border-color:transparent; padding:0; }

  #tray{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    padding:8px 4px;
  }

  .tile{
    min-width:52px;
    height:52px;
    padding:0 12px;
    border-radius:12px;
    background:linear-gradient(180deg,var(--card),#1f507d);
    color:#fff;
    font-size:1.25rem;
    font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.25);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease, opacity .15s ease;
  }
  .tile:active{ transform:scale(.93); }
  .tile.correct-flash{ background:linear-gradient(180deg,var(--good),#2c8f56); }
  .tile.wrong-flash{ background:linear-gradient(180deg,var(--bad),#b8362f); }

  #feedback{
    text-align:center;
    min-height:26px;
    font-size:.95rem;
    font-weight:700;
    margin-top:14px;
    color:#37425a;
  }
  #feedback.win{ color:var(--good); }
  #feedback.lose{ color:var(--bad); }

  #controls{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:16px;
    flex-wrap:wrap;
  }
  button.ctrl{
    border:none;
    border-radius:22px;
    padding:10px 18px;
    font-size:.9rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.15);
  }
  #listenBtn{ background:#ffd166; color:#5a4200; }
  #resetBtn{ background:#e0e6f0; color:#37425a; }
  #nextBtn{ background:var(--accent); color:#fff; }

  #pinyinNote{
    text-align:center;
    font-size:.72rem;
    color:#7a839c;
    margin-top:10px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🀄 拼句子 Sentence Builder</h1>
    <div id="progress">第 1 句 / 共 100 句</div>
  </header>

  <div id="card">
    <div id="instructions">点一点词语卡片，把句子排好吧！<br><span style="font-size:.75rem;">Tap the word tiles in order to build the sentence. Tap any tile to hear it out loud.</span></div>

    <div id="slots"></div>
    <div id="tray"></div>

    <div id="feedback"></div>

    <div id="controls">
      <button class="ctrl" id="listenBtn">🔊 听句子</button>
      <button class="ctrl" id="resetBtn">↺ 重来</button>
      <button class="ctrl" id="nextBtn">🎲 换一句</button>
    </div>
    <div id="pinyinNote">提示：点击词语卡片可以听发音 / Tap any tile to hear its pronunciation.</div>
  </div>
</div>

<script>

我们明天唱歌", "t": ["我们", "明天", "唱", "歌"]}, {"s": "妈妈今天喝牛奶", "t": ["妈妈", "今天", "喝", "牛奶"]}, {"s": "今天哥哥打篮球", "t": ["今天", "哥哥", "打", "篮球"]}, {"s": "他会喂小狗", "t": ["他", "会", "喂", "小狗"]}, {"s": "现在老师放风筝", "t": ["现在", "老师", "放", "风筝"]}, {"s": "早上同学们浇花", "t": ["早上", "同学们", "浇", "花"]}, {"s": "爸爸今天做作业", "t": ["爸爸", "今天", "做", "作业"]}, {"s": "今天小红唱歌", "t": ["今天", "小红", "唱", "歌"]}, {"s": "晚上同学们读课文", "t": ["晚上", "同学们", "读", "课文"]}, {"s": "现在我看电影", "t": ["现在", "我", "看", "电影"]}, {"s": "我们明天种花", "t": ["我们", "明天", "种", "花"]}, {"s": "我们今天看电视", "t": ["我们", "今天", "看", "电视"]}, {"s": "我和小明一起写作业", "t": ["我", "和", "小明", "一起", "写", "作业"]}, {"s": "弟弟在图书馆唱歌", "t": ["弟弟", "在", "图书馆", "唱", "歌"]}, {"s": "他们想做作业", "t": ["他们", "想", "做", "作业"]}, {"s": "现在小狗休息", "t": ["现在", "小狗", "休息"]}, {"s": "他们晚上休息", "t": ["他们", "晚上", "休息"]}, {"s": "妈妈在动物园荡秋千", "t": ["妈妈", "在", "动物园", "荡", "秋千"]}, {"s": "弟弟中午爬山", "t": ["弟弟", "中午", "爬山"]}];

let currentIndex = -1;
let correctTokens = [];   // e.g. ["我","在","学校","看","书"]
let slotState = [];       // array same length as correctTokens, each either null or {text, id}
let trayTiles = [];       // array of {text, id} still in tray

const slotsEl = document.getElementById('slots');
const trayEl = document.getElementById('tray');
const feedbackEl = document.getElementById('feedback');
const progressEl = document.getElementById('progress');
const listenBtn = document.getElementById('listenBtn');
const resetBtn = document.getElementById('resetBtn');
const nextBtn = document.getElementById('nextBtn');

let voicesReady = false;
function ensureVoices(){
  if (typeof speechSynthesis === 'undefined') return;
  speechSynthesis.getVoices();
}
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = ensureVoices;
  ensureVoices();
}

function speak(text){
  try{
    if (typeof speechSynthesis === 'undefined') return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.speak(u);
  }catch(e){ /* speech not supported, ignore */ }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickSentence(){
  let idx;
  do { idx = Math.floor(Math.random()*SENTENCES.length); } while (idx === currentIndex && SENTENCES.length > 1);
  currentIndex = idx;
  const item = SENTENCES[idx];
  correctTokens = item.t;
  progressEl.textContent = `第 ${idx+1} 句 / 共 ${SENTENCES.length} 句`;
}

function newRound(){
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  pickSentence();

  slotState = correctTokens.map(()=>null);

  let tiles = correctTokens.map((text, i) => ({ text, id: 'tile'+i }));
  let shuffled;
  do {
    shuffled = shuffle(tiles);
  } while (tiles.length > 1 && shuffled.every((t,i)=> t.text === tiles[i].text));
  trayTiles = shuffled;

  render();
}

function render(){
  // slots
  slotsEl.innerHTML = '';
  slotState.forEach((slot, i) => {
    const div = document.createElement('div');
    div.className = 'slot' + (slot ? ' filled' : '');
    if (slot) {
      const tile = makeTile(slot, () => returnToTray(i));
      div.appendChild(tile);
    }
    slotsEl.appendChild(div);
  });

  // tray
  trayEl.innerHTML = '';
  trayTiles.forEach((t) => {
    const tile = makeTile(t, () => placeInSlot(t));
    trayEl.appendChild(tile);
  });
}

function makeTile(tileObj, onClick){
  const el = document.createElement('div');
  el.className = 'tile';
  el.textContent = tileObj.text;
  el.addEventListener('click', () => {
    speak(tileObj.text);
    onClick();
  });
  return el;
}

function placeInSlot(tileObj){
  const emptyIdx = slotState.findIndex(s => s === null);
  if (emptyIdx === -1) return;
  slotState[emptyIdx] = tileObj;
  trayTiles = trayTiles.filter(t => t.id !== tileObj.id);
  render();
  checkIfComplete();
}

function returnToTray(slotIdx){
  const tileObj = slotState[slotIdx];
  if (!tileObj) return;
  slotState[slotIdx] = null;
  trayTiles.push(tileObj);
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  render();
}

function checkIfComplete(){
  if (slotState.some(s => s === null)) return;
  const arrangement = slotState.map(s => s.text);
  const isCorrect = arrangement.join('') === correctTokens.join('');
  if (isCorrect) {
    feedbackEl.textContent = '🎉 太棒了！句子正确！';
    feedbackEl.className = 'win';
    flashSlots('correct-flash');
    speak(correctTokens.join(''));
  } else {
    feedbackEl.textContent = '再试试看，顺序不太对哦～';
    feedbackEl.className = 'lose';
    flashSlots('wrong-flash');
  }
}

function flashSlots(cls){
  const tiles = slotsEl.querySelectorAll('.tile');
  tiles.forEach(t => t.classList.add(cls));
  setTimeout(() => tiles.forEach(t => t.classList.remove(cls)), 500);
}

listenBtn.addEventListener('click', () => {
  speak(correctTokens.join(''));
});

resetBtn.addEventListener('click', () => {
  slotState = correctTokens.map(()=>null);
  trayTiles = shuffle(correctTokens.map((text,i)=>({text,id:'tile'+i})));
  feedbackEl.textContent = '';
  feedbackEl.className = '';
  render();
});

nextBtn.addEventListener('click', newRound);

newRound();
</script>
