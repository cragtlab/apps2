<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer's World Map</title>
<style>
:root{
  --sea:#e9f6f9; --ocean:#bfe4f0; --land0:#cfd9df; --edge:#ffffff;
  --ink:#17324d; --card:#ffffff; --muted:#4d6a82; --line:#17324d; --k:#e8505b;
  --font:"Arial Rounded MT Bold","Nunito","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sea:#0f2233;--ocean:#12354f;--land0:#3a5266;--edge:#0f2233;--ink:#eaf6ff;--card:#17324d;--muted:#a9c4da;--line:#eaf6ff;}
}
:root[data-theme="dark"]{--sea:#0f2233;--ocean:#12354f;--land0:#3a5266;--edge:#0f2233;--ink:#eaf6ff;--card:#17324d;--muted:#a9c4da;--line:#eaf6ff;}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:var(--sea);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 12px 50px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:clamp(24px,5vw,38px);margin:0;line-height:1.05;letter-spacing:-.5px}
.sub{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,2.3vw,17px);line-height:1.35}
.passport{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 14px;box-shadow:4px 4px 0 var(--k);text-align:center;min-width:140px}
.passport b{font-size:26px;display:block;line-height:1}
.passport span{font-size:13px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:rgba(23,50,77,.18);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--k);width:0;transition:width .4s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px}
.tab{flex:0 0 auto;font:inherit;font-size:16px;cursor:pointer;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:14px;padding:7px 12px;display:flex;align-items:center;gap:7px;box-shadow:3px 3px 0 var(--c)}
.tab .e{font-size:22px}
.tab small{font-size:11px;color:var(--muted);display:block;line-height:1;margin-top:2px}
.tab[aria-selected="true"]{background:var(--c);color:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.tab[aria-selected="true"] small{color:#fff}
.layout{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.layout{grid-template-columns:1fr 330px;align-items:start}}
.mapbox{border:3px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--line);background:var(--ocean);aspect-ratio:4/3;max-height:78vh;width:100%;position:relative;touch-action:none;cursor:grab}
.mapbox.drag{cursor:grabbing}
@media (min-width:640px){.mapbox{aspect-ratio:16/10}}
svg{display:block;touch-action:none;user-select:none;-webkit-user-select:none;width:100%;height:100%;font-family:var(--font);-webkit-tap-highlight-color:transparent}
.ocean{fill:var(--ocean)}
.grays path{fill:var(--land0);stroke:var(--edge);stroke-width:.8;vector-effect:non-scaling-stroke}
.land{fill:var(--c);fill-opacity:.55;stroke:var(--edge);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill-opacity .25s}
.land.got{fill-opacity:1}
.land:hover{fill-opacity:.85}
.land.sel{stroke:var(--ink);stroke-width:3}
.land,.land:focus,.land:focus-visible{outline:none}
.land:focus-visible{stroke:#ffb703;stroke-width:4}
.lbl{cursor:pointer;transition:opacity .3s}
.lbl text{font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-linejoin:round;fill:var(--ink)}
.callout{font-weight:700;text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-linejoin:round;fill:var(--ink);pointer-events:none}
.ring{fill:none;stroke:var(--k);stroke-width:4;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;pointer-events:none;animation:ping 1.2s ease-out 3}
.ring.hint{animation-iteration-count:infinite}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(3);opacity:0}}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;font:inherit;font-size:26px;line-height:1;cursor:pointer;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:12px;box-shadow:2px 2px 0 var(--line);padding:0}
.zoom button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}
.legend{position:absolute;left:8px;bottom:8px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:4px 9px;font-size:12px;color:var(--muted);pointer-events:none}
.panel{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search input{font:inherit;font-size:17px;width:100%;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:3px solid var(--line);border-radius:14px;z-index:5;overflow:hidden}
.results button{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-size:16px;color:var(--ink);background:none;border:0;border-bottom:1px solid rgba(23,50,77,.2);padding:8px 12px;cursor:pointer;text-align:left}
.results button:last-child{border-bottom:0}
.results img{width:36px;height:24px;border-radius:3px;border:1px solid var(--line);object-fit:cover}
.info{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:16px;box-shadow:5px 5px 0 var(--c,var(--k));text-align:center}
.info .prompt{font-size:18px;line-height:1.4;color:var(--muted);padding:10px 4px}
.info .prompt b{font-size:34px;display:block}
.fimg{display:block;width:100%;max-width:200px;aspect-ratio:3/2;height:auto;margin:0 auto 8px;border:3px solid var(--line);border-radius:8px;background:#fff;object-fit:cover}
.info h2{margin:2px 0;font-size:clamp(24px,4vw,30px);line-height:1.1}
.info .capital{font-size:18px;margin:4px 0}
.chip{display:inline-block;font-size:14px;color:#fff;background:var(--c);border-radius:99px;padding:3px 12px;margin:4px 0}
.fact{font-size:15px;color:var(--muted);margin:8px 0 2px;line-height:1.35}
.stampline{font-size:17px;margin:8px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.btn{font:inherit;font-size:17px;cursor:pointer;color:#fff;background:var(--k);border:3px solid var(--line);border-radius:14px;padding:9px 16px;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.play{background:#2fb67c}
.msg{min-height:30px;font-size:19px;margin:8px 0 0;line-height:1.3}
.score{color:var(--muted);font-size:14px;margin-top:4px}
.small{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;align-self:center}
.topright{display:flex;gap:10px;align-items:stretch;flex:1 1 auto;justify-content:flex-end;min-width:0}
.gamebar{display:flex;gap:10px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;box-shadow:4px 4px 0 #2fb67c;flex:1 1 260px;max-width:380px;min-width:0}
.gamebar[hidden]{display:none}
.gamebar.idle{background:none;border:0;box-shadow:none;padding:0;flex:0 0 auto}
.gamebar.idle .btn{height:100%;font-size:18px;line-height:1.2;padding:8px 18px}
.gamebar .gflag{width:72px;aspect-ratio:3/2;height:auto;border:2px solid var(--line);border-radius:6px;object-fit:cover;flex:none;background:#fff}
.gamebar .gq{font-size:17px;line-height:1.15;font-weight:700}
.gamebar .gm{font-size:13px;color:var(--muted);line-height:1.25;margin-top:2px}
.gamebar .gb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.gamebar .gb button{font:inherit;font-size:14px;padding:3px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.gamebar .gb button.go{background:#2fb67c;color:#fff}
.gamebar .gs{font-size:14px;margin-left:auto}
@media (max-width:640px){.topright{width:100%;flex-wrap:nowrap;justify-content:stretch}.passport{min-width:0;padding:6px 10px}.passport b{font-size:20px}.passport span{font-size:11px}.gamebar{padding:6px 8px;gap:8px;max-width:none}.gamebar.idle{flex:1;padding:0}.gamebar.idle .btn{width:100%;font-size:17px;padding:6px 8px}.gamebar .gflag{width:54px}.gamebar .gq{font-size:15px}.gamebar .gm{font-size:12px}}
:focus-visible{outline:4px solid #ffb703;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🌍 My Explorer World Map</h1>
      <p class="sub">Tap a country to meet it! Zoom in (＋) and drag the map to find the tiny ones.</p>
    </div>
    <div class="topright">
      <div class="passport" aria-live="polite">
        <b id="count">0 / 195</b><span>stamps collected</span>
        <div class="bar"><i id="barfill"></i></div>
      </div>
      <div class="gamebar idle" id="gamebar"></div>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Pick a continent"></div>

  <div class="layout">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 1080 426" role="img" aria-label="World map. Tap a country."></svg>
      <div class="zoom"><button id="zin" aria-label="Zoom in">＋</button><button id="zout" aria-label="Zoom out">－</button><button id="zhome" aria-label="Whole world" style="font-size:20px">🌍</button></div>
      <div class="legend">Drag to move · Pinch to zoom</div>
    </div>

    <div class="panel">
      <div class="search">
        <input id="search" type="search" placeholder="🔎 Where is…? Type a country" aria-label="Find a country" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
      <div class="info" id="info"></div>
      <button class="small" id="resetBtn">Start over (clear stamps)</button>
    </div>
  </div>
</div>

let view = { x: 0, y: 0, w: 1080, h: 426 };

function targetView(key) {

  if (w / hh < r) w = hh * r; else hh = w / r;

  K = (svg.clientWidth || 600) / view.w;
  const fs = (window.innerWidth < 640 ? 15 : 18) / K;
  lblEls.forEach(t => { t.style.fontSize = fs + "px"; t.style.strokeWidth = (5 / K) + "px"; });
  over.querySelectorAll(".ring").forEach(e => e.setAttribute("r", 13 / K));
  over.querySelectorAll(".callout").forEach(t => {
    t.style.fontSize = (17 / K) + "px"; t.style.strokeWidth = (5 / K) + "px";
    t.setAttribute("y", (+t.dataset.cy) - 22 / K);
  });
  svg.querySelectorAll(".lbl").forEach(g => { const on = view.w > 700; g.style.opacity = on ? 1 : 0; g.style.pointerEvents = on ? "auto" : "none"; });
}

const aspect = () => (svg.clientWidth / svg.clientHeight) || 1.5;

}

let anim = 0;
function zoomToView(to) {
  const from = { ...view };
  cancelAnimationFrame(anim);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { setView(to); return; }
  const t0 = performance.now(), D = 650;
  const step = now => {
    let t = Math.min(1, (now - t0) / D); t = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

}

// zoom around a point on screen (sx, sy in pixels inside the map)
function zoomAt(f, sx, sy) {
  const r = svg.getBoundingClientRect();
  const fx = sx / r.width, fy = sy / r.height;
  const ux = view.x + fx * view.w, uy = view.y + fy * view.h;
  const w = Math.min(1300, Math.max(7, view.w / f)), hh = w / aspect();
  setView(clampView({ x: ux - fx * w, y: uy - fy * hh, w, h: hh }));

// zoom so a single country is nicely visible (tiny ones get zoomed a lot). Returns true if the Pacific copy is used.
function zoomToCountry(code, wide) {
  const el = (landEls[code] || []).find(e => !e.dataset.w);
  let b = null; try { b = el.getBBox(); } catch (e) {}
  if (!b || b.width > 220) { zoomToView(targetView(BY[code].key)); return false; }
  const wrapped = GEO.wrap.includes(code);
  const cx = b.x + b.width / 2 + (wrapped ? 1080 : 0), cy = b.y + b.height / 2;
  let w = wide ? Math.max(b.width * 2.6, 70) : Math.max(b.width * 3.6, 24);
  w = Math.max(w, b.height * (wide ? 2.6 : 3.6) * aspect());
  zoomToView(frame(cx, cy, w));
  return wrapped;
}

const ptrs = new Map(); let drag = null, pinchD = 0;

  zoomAt(Math.exp(-e.deltaY * 0.0018), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$("zin").onclick = () => zoomAt(1.7, svg.clientWidth / 2, svg.clientHeight / 2);
$("zout").onclick = () => zoomAt(1 / 1.7, svg.clientWidth / 2, svg.clientHeight / 2);
$("zhome").onclick = () => goContinent("all");

// ---------- tabs & progress ----------
const tabsEl = $("tabs");
function renderTabs() {
  tabsEl.innerHTML = "";
  const entries = [["all", { name: "World", e: "🌍", c: "#17324d", list: ALL }], ...Object.entries(WORLD)];
  for (const [key, cont] of entries) {
    const got = cont.list.filter(x => stamped.has(x.code)).length;
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", key === mode);
    b.style.setProperty("--c", cont.c);
    b.innerHTML = `<span class="e">${cont.e}</span><span>${cont.name}<small>${got} / ${cont.list.length}</small></span>`;
    b.onclick = () => goContinent(key);
    tabsEl.appendChild(b);
  }
}
function paintStamps() {
  for (const [c, els] of Object.entries(landEls)) els.forEach(el => el.classList.toggle("got", stamped.has(c)));
  const n = stamped.size;
  $("count").textContent = n + " / " + ALL.length;
  $("barfill").style.width = (n / ALL.length * 100) + "%";
  renderTabs();
}
function stamp(code) { if (!stamped.has(code)) { stamped.add(code); save(); paintStamps(); } }

// ---------- overlay: ring + name tag ----------
function posOf(code, wrapped) {
  const c = GEO.cent[code];
  const useWrap = GEO.wrap.includes(code) && (wrapped === undefined ? view.x + view.w / 2 > 700 : wrapped);
  return useWrap ? [c[0] + 1080, c[1]] : c;
}
function mark(code, { label = true, hint = false, wrapped } = {}) {
  over.innerHTML = "";
  const p = posOf(code, wrapped); if (!p) return;
  const NS = "http://www.w3.org/2000/svg";
  const ring = document.createElementNS(NS, "circle");
  ring.setAttribute("class", "ring" + (hint ? " hint" : "")); ring.setAttribute("cx", p[0]); ring.setAttribute("cy", p[1]);
  over.appendChild(ring);
  if (label) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("class", "callout"); t.setAttribute("x", p[0]); t.dataset.cy = p[1];
    t.textContent = BY[code].name;
    over.appendChild(t);
  }
  rescale();
}
let selected = null;
function highlight(code) {
  if (selected) (landEls[selected] || []).forEach(e => e.classList.remove("sel"));
  selected = code;
  if (code) (landEls[code] || []).forEach(e => { e.classList.add("sel"); if (e.tagName === "path") e.parentNode.appendChild(e); });
}

// ---------- info card ----------
const infoEl = $("info");
function showPrompt() {
  infoEl.style.setProperty("--c", "#e8505b");
  infoEl.innerHTML = `<div class="prompt"><b>👆</b>Tap any country on the map to see its flag and capital!<br><br>Or press <b style="display:inline;font-size:inherit">Play</b> at the top to hunt for countries!</div>`;
}
function showCountry(code) {
  const x = BY[code];
  infoEl.style.setProperty("--c", x.color);
  infoEl.innerHTML = `${flagImg(code, "fimg")}<h2>${x.name}</h2>
  <div class="capital">Capital: <b>${x.cap}</b></div>
  <span class="chip" style="--c:${x.color}">${WORLD[x.key].e} ${WORLD[x.key].name}</span>
  ${FACTS[code] ? `<p class="fact">💡 ${FACTS[code]}</p>` : ""}
  <p class="stampline">⭐ Stamped in your passport!</p>
  <div class="btns"><button class="btn alt" id="sayBtn">🔊 Say it</button></div>`;
  $("sayBtn").onclick = () => say(`${x.name}. The capital is ${x.cap}.`);
}
function select(code, zoom) {
  if (game.on) return;
  const x = BY[code];
  stamp(code);
  highlight(code);
  let wr;
  if (zoom) { mode = x.key; renderTabs(); wr = zoomToCountry(code, false); }
  mark(code, { wrapped: wr });
  showCountry(code);
  say(`${x.name}. The capital is ${x.cap}.`);
}

// ---------- game ----------
const game = { on: false, target: null, wrong: 0, score: 0, asked: 0, locked: false, last: null };
const gamebar = $("gamebar");
function startGame() {
  game.on = true; game.score = 0; game.asked = 0;
  highlight(null); over.innerHTML = "";
  infoEl.hidden = true; gamebar.className = "gamebar";
  window.scrollTo({ top: 0, behavior: "smooth" });
  nextRound();
}
function showIdleBar() {
  gamebar.className = "gamebar idle";
  gamebar.innerHTML = '<button class="btn play" id="playBtn">🎯 Play!<br>Find the country</button>';
  $("playBtn").onclick = startGame;
}
function endGameUI() { game.on = false; infoEl.hidden = false; showIdleBar(); }
function stopGame() {
  endGameUI(); over.innerHTML = ""; showPrompt();
}
function nextRound() {
  const pool = mode === "all" ? ALL : WORLD[mode].list;
  let t; do { t = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && t.code === game.last);
  game.target = t; game.last = t.code; game.wrong = 0; game.locked = false;
  over.innerHTML = "";
  gamebar.innerHTML = `${flagImg(t.code, "gflag")}<div><div class="gq">Where is ${t.name}?</div>
  <div class="gm" id="msg" aria-live="polite">Tap it on the map! 👆</div>
  <div class="gb"><button id="hintBtn">💡 Hint</button><button class="go" id="nextBtn" hidden>Next ➜</button><button id="stopBtn" aria-label="Stop game">✖</button><span class="gs" id="gscore">⭐ ${game.score}</span></div></div>`;
  $("hintBtn").onclick = hint; $("nextBtn").onclick = nextRound; $("stopBtn").onclick = stopGame;
  say(`Where is ${t.name}?`);
}
function hint() {
  const t = game.target;
  const wr = zoomToCountry(t.code, true);
  mark(t.code, { label: false, hint: true, wrapped: wr });
  $("msg").textContent = `Look for the blinking circle! 👀 (${WORLD[t.key].name})`;
}
function guess(code) {
  if (game.locked) return;
  const t = game.target;
  if (code === t.code) {
    game.locked = true; game.score++; game.asked++;
    stamp(code); highlight(code); mark(code);
    $("msg").textContent = `🎉 Yes! ${t.name}! Capital: ${t.cap}`;
    $("gscore").textContent = `⭐ ${game.score}`;
    $("nextBtn").hidden = false; $("hintBtn").hidden = true; $("nextBtn").focus();
    say(`Yes! That is ${t.name}. The capital is ${t.cap}.`);
  } else {
    game.wrong++;
    $("msg").textContent = `That is ${BY[code].name}. Try again! 💪`;
    say(`That is ${BY[code].name}. Keep looking!`);
    if (game.wrong >= 2) setTimeout(hint, 900);
  }
}

// ---------- clicks ----------
function pick(code) { game.on ? guess(code) : select(code, false); }
function tap(el) {
  if (!el || !el.closest) return;
  const c = el.closest("[data-c]");
  if (c) { pick(c.dataset.c); return; }
  const k = el.closest("[data-k]");
  if (k) goContinent(k.dataset.k);
}
svg.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const c = e.target.closest("[data-c]");
  if (c) { e.preventDefault(); pick(c.dataset.c); }
});

// ---------- search ----------
const sIn = $("search"), sRes = $("results");
sIn.addEventListener("input", () => {
  const q = sIn.value.trim().toLowerCase();
  sRes.innerHTML = "";
  if (!q) { sRes.hidden = true; return; }
  const hits = ALL.filter(x => x.name.toLowerCase().includes(q)).sort((a, b) => a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q)).slice(0, 6);
  if (!hits.length) { sRes.innerHTML = '<button disabled>No country found 🧐</button>'; sRes.hidden = false; return; }
  for (const x of hits) {
    const b = document.createElement("button");
    b.innerHTML = `<img src="${flagSrc(x.code)}" alt=""><span>${x.name}</span>`;
    b.onclick = () => { sIn.value = ""; sRes.hidden = true; if (game.on) endGameUI(); select(x.code, true); };
    sRes.appendChild(b);
  }
  sRes.hidden = false;
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) sRes.hidden = true; });

// ---------- reset ----------
let armed = false;
$("resetBtn").onclick = function () {
  if (!armed) { armed = true; this.textContent = "Tap again to really clear all stamps"; setTimeout(() => { armed = false; this.textContent = "Start over (clear stamps)"; }, 3500); return; }
  armed = false; stamped = new Set(); save(); paintStamps(); highlight(null); over.innerHTML = ""; this.textContent = "Start over (clear stamps)";
  if (!game.on) showPrompt();
};

// ---------- go ----------
setView(targetView("all"));
paintStamps();
showPrompt();
showIdleBar();
</script>
</body>
</html>
