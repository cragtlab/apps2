<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Index</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .games-list {
            display: grid;
            gap: 10px;
        }
        .game-item {
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .game-item:hover {
            background-color: #f0f7ff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .game-link {
            text-decoration: none;
            color: #0366d6;
            display: block;
        }
        .game-link:active {
            color: #0256c7;
        }
    </style>
</head>
<body>
    <h1>Games Index</h1>
    <div id="gamesList" class="games-list"></div>

    <script>
        const games = [
            "Sudoku for Kids.html",
            "Balloon vs Cups.html",
            "Say That Pokémon! (1).html",
            "Say That Pokémon!.html",
            "world-map-explorer.html",
            "Weigh It Out (2).html",
            "learn-our-countries.html",
            "Abacus.htm",
            "Chick.htm",
            "Chick2.htm",
            "Claw.htm",
            "email.htm",
            "Focus.html",
            "GameMemory1.htm",
            "invader.htm",
            "miniHOMM.html",
            "monopoly.htm",
            "robot1.htm",
            "slicer.html",
            "story.html",
            "teeth.html",
            "TextRPG.html",
            "testSpell (1).htm",
            "testSpellCN.htm",
            "word_scramble_game.html",
            "ant-trail-5.html",
            "chicken_escape.html",
            "ant-trail-3.html",
            "cascadia-2p.html",
            "isometric-farm.html",
            "tents-and-trees.html",
            "schoolbag-game.html",
            "tilt-maze-3.html",
            "trace-and-draw.html",
            "trace-chinese.html",
            "chinese-sentence-game-1.html",
            "chinese-sentence-game.html",
            "ant-trail.html",
            "tilt-maze.html",
            "shape-twist.html",
            "letter-hunt.html",
            "fingertip-fish-river.html",
            "monster-gobblet-tictactoe.html",
            "mow.htm",
            "fog.htm",
            "fog2.htm",
            "arslots.htm",
            "claw1.htm",
            "crossing.htm",
            "liubei1.htm",
            "liubei_clashroyal.htm",
            "liubei_clashroyalV2.htm",
            "liubei_clashroyalV3.htm",
            "mario.html",
            "tower.htm",
            "pizza_game.html",
            "maths7.htm"
        ];

        const gamesList = document.getElementById('gamesList');

        for (const file of games) {
            const item = document.createElement('div');
            item.className = 'game-item';

            const link = document.createElement('a');
            link.href = file;
            link.className = 'game-link';
            link.textContent = file.replace(/\.(htm|html)$/i, '');

            item.appendChild(link);
            gamesList.appendChild(item);
        }
    </script>
</body>
</html>
