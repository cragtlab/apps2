<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene detector</title>
<style>body{font:15px system-ui;margin:18px;color:#142033}button,input{font:inherit;margin:4px;padding:7px}video{width:100%;max-height:48vh;background:#000}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #d7e0eb;text-align:left}canvas{display:none}</style>
<h2>Fast visual scene detector</h2><p>Uses the shared player above. Scanning moves its playhead.</p><label> Sample every <input id="step" type="number" value="1" min=".2" step=".1" style="width:55px"> seconds</label><label> Cut threshold <input id="limit" type="number" value="11" min="1" max="50" style="width:45px"></label><button id="run" disabled>Detect scenes</button><p id="status">Waiting for a video from the main explorer.</p><progress id="p" value="0" max="1" style="width:100%"></progress><table><thead><tr><th>#</th><th>Start</th><th>End</th></tr></thead><tbody id="out"></tbody></table><canvas id="c" width="48" height="27"></canvas>
<script>const $=x=>document.getElementById(x),c=$('c'),x=c.getContext('2d',{willReadFrequently:true});let v;const time=n=>new Date(n*1000).toISOString().slice(11,19);function attach(){v=parent.VideoExplorer?.getVideo();if(!v||!parent.VideoExplorer.hasVideo())return;$('run').disabled=false;draw([{a:0,b:v.duration}]);$('status').textContent='Ready. Reading the shared player; no second video was loaded.'}parent.VideoExplorer?.onVideoChange(attach);addEventListener('load',attach);function seek(t){return new Promise((ok,no)=>{if(Math.abs(v.currentTime-t)<.01)return ok();let z=setTimeout(()=>no(Error('seek timeout')),8000);v.onseeked=()=>{clearTimeout(z);ok()};v.currentTime=t})}function frame(){x.drawImage(v,0,0,c.width,c.height);let d=x.getImageData(0,0,c.width,c.height).data,a=[];for(let i=0;i<d.length;i+=4)a.push((d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255);return a}function diff(a,b){return a.reduce((s,n,i)=>s+Math.abs(n-b[i]),0)/a.length*100}function draw(s){$('out').innerHTML=s.map((z,i)=>`<tr><td>${i+1}</td><td>${time(z.a)}</td><td>${time(z.b)}</td></tr>`).join('')}$('run').onclick=async()=>{let step=+$('step').value||1,limit=+$('limit').value||11,cuts=[0],last,avg=0,n=0;try{for(let t=0;t<v.duration;t+=step){await seek(t);let now=frame();if(last){let score=diff(last,now),base=n?avg:0;avg=(avg*n+score)/++n;if(score>=Math.max(limit,base*3)&&t-cuts.at(-1)>step*1.4)cuts.push(t)}last=now;$('p').value=t/v.duration;$('status').textContent='Scanning '+time(t)+' / '+time(v.duration)}let s=cuts.map((a,i)=>({a,b:cuts[i+1]??v.duration}));draw(s);$('p').value=1;$('status').textContent='Found '+s.length+' scene(s). Lower threshold if cuts were missed.'}catch(e){$('status').textContent='Scan failed: '+e.message}};</script>
