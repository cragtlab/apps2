<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast people cuts</title><script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<style>body{font:15px system-ui;margin:18px;color:#142033}button,input{font:inherit;margin:4px;padding:7px}video{width:100%;max-height:48vh;background:#000}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #d7e0eb;text-align:left}</style>
<h2>Fast people-cut detector</h2><p>Uses the shared player above plus the online COCO-SSD model. It detects <b>people</b>, not faces, and samples every 2 seconds for speed. Scanning moves the shared playhead.</p><button id="run" disabled>Load model and scan</button><p id="status">Waiting for a video from the main explorer.</p><progress id="p" value="0" max="1" style="width:100%"></progress><table><thead><tr><th>Time</th><th>People detected</th></tr></thead><tbody id="out"></tbody></table>
<script>const $=x=>document.getElementById(x);let v;function attach(){v=parent.VideoExplorer?.getVideo();if(!v||!parent.VideoExplorer.hasVideo())return;$('run').disabled=false;$('status').textContent='Ready. The model downloads when you scan; the video is shared.'}parent.VideoExplorer?.onVideoChange(attach);addEventListener('load',attach);function seek(t){return new Promise((ok,no)=>{if(Math.abs(v.currentTime-t)<.01)return ok();let z=setTimeout(()=>no(Error('seek timeout')),8000);v.onseeked=()=>{clearTimeout(z);ok()};v.currentTime=t})}$('run').onclick=async()=>{try{$('run').disabled=true;$('status').textContent='Downloading COCO-SSD model…';await tf.setBackend('webgl');await tf.ready();let m=await cocoSsd.load({base:'lite_mobilenet_v2'}),rows=[];for(let t=0;t<v.duration;t+=2){await seek(t);let people=(await m.detect(v,10,.5)).filter(o=>o.class==='person');if(people.length)rows.push([t,people.length]);$('p').value=t/v.duration;$('status').textContent='Scanning '+t.toFixed(0)+' / '+v.duration.toFixed(0)+' seconds'}$('out').innerHTML=rows.map(r=>`<tr><td>${new Date(r[0]*1000).toISOString().slice(11,19)}</td><td>${r[1]}</td></tr>`).join('')||'<tr><td colspan="2">No people found at 2-second sample points.</td></tr>';$('p').value=1;$('status').textContent='Done: '+rows.length+' sample point(s) with people.'}catch(e){$('status').textContent='Model/scan failed: '+e.message}finally{$('run').disabled=false}};</script>
