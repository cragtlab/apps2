<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Explorer</title>
<script>addEventListener('DOMContentLoaded',()=>{const original=window.VideoExplorer.getVideo;window.VideoExplorer.getVideo=()=>{const video=original();video.pause();return video}})</script>
<style>body{margin:0;background:#10151d;color:#eef3f8;font:16px system-ui;max-width:1100px;padding:28px;margin:auto}.drop{border:2px dashed #4f8cff;border-radius:14px;padding:42px;text-align:center;background:#18212d}.drop.over{background:#253a55}button,input{padding:10px 14px;border:0;border-radius:8px;background:#4f8cff;color:#fff;font:inherit;cursor:pointer;margin:8px 8px 0 0}input{color:#142033;background:#fff}video{margin-top:18px;width:100%;max-height:55vh;background:#000;border-radius:10px}.muted{color:#aab7c7}#tool{margin-top:20px;background:#f7faff;color:#142033;border-radius:10px;padding:18px}#tool button{background:#2864c7}#tool table{border-collapse:collapse;width:100%}#tool td,#tool th{padding:8px;border-bottom:1px solid #d7e0eb;text-align:left}</style>
<h1>Video Explorer</h1><p class="muted">This page owns the shared video player. Plug-ins read frames from it directly; your file is never loaded twice.</p>
<div class="drop" id="drop"><b>Drop a video here</b><br><small>or</small><br><input id="pick" type="file" accept="video/*"></div><div id="details" class="muted"></div><video id="video" controls playsinline preload="metadata"></video>
<div><button data-tool="scene">Scene detector</button><button data-tool="face">Face detector</button><button data-tool="people">People detector</button><button data-tool="ai">Combined AI detector</button></div><section id="tool"><span class="muted">Choose a tool after loading a video.</span></section>
<script src="video_plugin_scene_detector.js"></script><script src="video_plugin_face_detector.js"></script><script src="video_plugin_people_cut.js"></script><script src="video_plugin_ai_detector.js"></script><script>const pick=document.querySelector('#pick'),drop=document.querySelector('#drop'),video=document.querySelector('#video'),details=document.querySelector('#details'),tool=document.querySelector('#tool');let chosen,url,active,plugins={},panes={};const listeners=new Set;window.VideoExplorer={getVideo:()=>video,getFile:()=>chosen||null,hasVideo:()=>!!chosen,onVideoChange:fn=>{listeners.add(fn);return()=>listeners.delete(fn)},getStream:()=>video.captureStream?.()||null};function clearPlugins(){Object.values(plugins).forEach(p=>p.destroy?.());plugins={};panes={};active=null;tool.innerHTML='<span class="muted">Choose a tool after loading a video.</span>'}function load(f){if(!f||!f.type.startsWith('video/'))return alert('Please choose a video file.');clearPlugins();if(url)URL.revokeObjectURL(url);chosen=f;url=URL.createObjectURL(f);video.src=url;details.textContent=f.name+' — '+(f.size/1048576).toFixed(1)+' MB.';video.onloadedmetadata=()=>{listeners.forEach(fn=>fn(video));active?.refresh?.()}}function showPlugin(key){if(!plugins[key]){if(!Object.keys(panes).length)tool.innerHTML='';const pane=document.createElement('div');pane.hidden=true;tool.append(pane);panes[key]=pane;plugins[key]=window.VideoPlugins[key].mount(pane,window.VideoExplorer)}Object.values(panes).forEach(p=>p.hidden=true);panes[key].hidden=false;active=plugins[key];active.refresh?.()}pick.onchange=()=>load(pick.files[0]);['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.ondrop=e=>load(e.dataTransfer.files[0]);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{if(!chosen)return alert('Drop or choose a video first.');showPlugin(b.dataset.tool)});</script>
