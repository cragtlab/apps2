<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Matcher & Highlighter</title>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #drop-zone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            color: #3498db;
            background-color: #fcfcfc;
            transition: all 0.3s;
            cursor: pointer;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 150px;
        }
        #drop-zone.dragover {
            background-color: #ebf5fb;
            border-color: #2980b9;
            color: #2980b9;
        }
        #drop-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52,152,219,0.3);
        }
        #status {
            font-size: 14px;
            color: #e67e22;
            font-weight: 500;
        }
        .results-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .results-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            word-break: break-all;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover td {
            background-color: #f8fafc;
        }
        .highlight {
            background-color: #ffeb3b !important; /* Vivid yellow */
            color: #000 !important;
            font-weight: bold;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        }
        .stats-badge {
            background-color: #2ecc71;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Hash Matcher & Highlighter</h1>
    <p class="subtitle">Drop a hash table file, and input a list of hashes to highlight matching items instantly.</p>

    <div class="container">
        <div class="panel">
            <label for="hash-input">Hashes to Highlight (One per line / delimited)</label>
            <textarea id="hash-input" placeholder="Paste hashes here, one per line (e.g. d41d8cd98f00b204e9800998ecf8427e)..."></textarea>
        </div>

        <div class="panel">
            <label>
                <span>Select / Drop Hash File</span>
                <span id="status">No file loaded</span>
            </label>
            <div id="drop-zone">
                <div id="drop-icon">📂</div>
                <div>Drag & Drop XLSX, CSV, or TXT file here or click to select</div>
                <input type="file" id="file-input" style="display: none;" accept=".xlsx,.xls,.csv,.txt">
            </div>
        </div>
    </div>

    <div class="results-section" id="results-area" style="display: none;">
        <div class="results-header">
            <span class="results-title">File Data Table</span>
            <span id="match-stats" class="stats-badge" style="display: none;">0 matches</span>
        </div>
        <div class="table-container">
            <table id="data-table"></table>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const hashInput = document.getElementById('hash-input');
        const status = document.getElementById('status');
        const resultsArea = document.getElementById('results-area');
        const dataTable = document.getElementById('data-table');
        const matchStats = document.getElementById('match-stats');

        let tableHeaders = [];
        let tableRows = [];

        // Drag and drop setup
        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };

        dropZone.ondragleave = () => {
            dropZone.classList.remove('dragover');
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                processFile(e.dataTransfer.files[0]);
            }
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length) {
                processFile(e.target.files[0]);
            }
        };

        // Real-time hash highlighting on keyup/input
        hashInput.addEventListener('input', highlightMatches);

        function processFile(file) {
            status.textContent = 'Loading ' + file.name + '...';
            const reader = new FileReader();
            const extension = file.name.split('.').pop().toLowerCase();

            if (extension === 'xlsx' || extension === 'xls') {
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        parseRows(rows);
                        status.textContent = `Loaded: ${file.name}`;
                    } catch (err) {
                        console.error(err);
                        status.textContent = 'Error parsing Excel file.';
                    }
                };
                reader.readAsArrayBuffer(file);
            } else {
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        let rows = [];

                        // Split into lines
                        const lines = text.split(/\r?\n/);
                        lines.forEach(line => {
                            if (line.trim() === '') return;
                            // Check for tab-separated or comma-separated
                            if (line.includes('\t')) {
                                rows.push(line.split('\t'));
                            } else if (line.includes(',')) {
                                // Basic CSV splitter (doesn't handle commas in quotes, but standard for hashes)
                                rows.push(line.split(','));
                            } else {
                                rows.push([line]);
                            }
                        });

                        parseRows(rows);
                        status.textContent = `Loaded: ${file.name}`;
                    } catch (err) {
                        console.error(err);
                        status.textContent = 'Error parsing Text/CSV file.';
                    }
                };
                reader.readAsText(file);
            }
        }

        function parseRows(rows) {
            if (rows.length === 0) {
                dataTable.innerHTML = '<tr><td>No data found in the file.</td></tr>';
                resultsArea.style.display = 'block';
                return;
            }

            // Treat the first row as headers if there are multiple rows
            if (rows.length > 1) {
                tableHeaders = rows[0].map(h => h !== undefined && h !== null ? String(h).trim() : "");
                tableRows = rows.slice(1);
            } else {
                tableHeaders = rows[0].map((_, idx) => `Column ${idx + 1}`);
                tableRows = rows;
            }

            renderTable();
        }

        function renderTable() {
            let html = '<thead><tr>';
            tableHeaders.forEach(header => {
                html += `<th>${escapeHtml(header)}</th>`;
            });
            html += '</tr></thead><tbody>';

            tableRows.forEach(row => {
                html += '<tr>';
                // Render cells up to tableHeaders length to handle misaligned rows
                for (let i = 0; i < tableHeaders.length; i++) {
                    const val = row[i] !== undefined && row[i] !== null ? String(row[i]).trim() : '';
                    html += `<td data-val="${escapeHtml(val.toLowerCase())}">${escapeHtml(val)}</td>`;
                }
                html += '</tr>';
            });
            html += '</tbody>';

            dataTable.innerHTML = html;
            resultsArea.style.display = 'block';
            highlightMatches();
        }

        function highlightMatches() {
            // Parse input hashes
            const lines = hashInput.value.split(/[\n,\s]+/);
            const targetHashes = new Set();
            lines.forEach(line => {
                const clean = line.trim().replace(/^["']|["']$/g, '').toLowerCase();
                if (clean) {
                    targetHashes.add(clean);
                }
            });

            let matchCount = 0;
            const cells = dataTable.querySelectorAll('tbody td');

            cells.forEach(cell => {
                const cellVal = cell.getAttribute('data-val');
                if (targetHashes.size > 0 && targetHashes.has(cellVal)) {
                    cell.classList.add('highlight');
                    matchCount++;
                } else {
                    cell.classList.remove('highlight');
                }
            });

            if (targetHashes.size > 0) {
                matchStats.style.display = 'inline-block';
                matchStats.textContent = `${matchCount} match${matchCount === 1 ? '' : 'es'} found`;
            } else {
                matchStats.style.display = 'none';
            }
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }
    </script>
</body>
</html>
